<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criativos gerados</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f6f6f3; --ink: #12181f; --ink-soft: #5d6672;
    --line: #e5e4de; --yellow: #ffc516; --dark: #12181f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #10161d; --surface: #171f28; --ink: #f2f4f6; --ink-soft: #97a2ae; --line: #26303b; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 24px 20px 64px;
  }
  header.page { max-width: 1180px; margin: 0 auto 20px; }
  header.page h1 { font-size: 22px; margin: 0 0 6px; font-weight: 800; }
  header.page p { margin: 0; color: var(--ink-soft); max-width: 70ch; }
  .filters { max-width: 1180px; margin: 0 auto 18px; display: flex; gap: 8px; flex-wrap: wrap; }
  .filters button {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .filters button.active { background: var(--yellow); border-color: var(--yellow); color: #12181f; }
  .count { max-width: 1180px; margin: 0 auto 12px; color: var(--ink-soft); font-size: 13px; }
  .grid {
    max-width: 1180px; margin: 0 auto; display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; display: flex; flex-direction: column; cursor: zoom-in;
  }
  /* carrossel: pilha visual (bordas atrás sugerem "vários slides") */
  .card.is-carousel { position: relative; overflow: visible; }
  .card.is-carousel::before, .card.is-carousel::after {
    content: ""; position: absolute; inset: 0; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line); z-index: -1;
  }
  .card.is-carousel::before { transform: translate(6px, 6px); }
  .card.is-carousel::after { transform: translate(12px, 12px); opacity: .6; }
  .card .thumb { position: relative; }
  .card img { width: 100%; height: auto; display: block; background: #22272e; border-radius: 12px 12px 0 0; }
  .car-badge {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    background: rgba(18,24,31,.86); color: #fff; font-weight: 700;
    font-size: 11px; padding: 4px 9px; border-radius: 999px;
    display: flex; align-items: center; gap: 5px;
  }
  .car-badge svg { width: 12px; height: 12px; }
  .card .meta { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font: 10.5px/1 ui-monospace, Menlo, monospace; padding: 4px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--ink-soft);
  }
  .chip.brand-metta { background: var(--yellow); border-color: var(--yellow); color: #12181f; font-weight: 700; }
  .chip.brand-tiago { background: var(--dark); border-color: var(--dark); color: #fff; font-weight: 700; }
  .chip.is-carousel { background: #2b6cb0; border-color: #2b6cb0; color: #fff; font-weight: 700; }
  .card h3 { margin: 0; font-size: 13.5px; line-height: 1.35; font-weight: 700; }
  .card .qa { font-size: 11.5px; color: var(--ink-soft); }
  .empty { max-width: 1180px; margin: 40px auto; text-align: center; color: var(--ink-soft); }
  /* lightbox / visualizador de carrossel */
  .lb {
    position: fixed; inset: 0; background: rgba(10,13,17,.93); display: none;
    align-items: center; justify-content: center; padding: 24px; z-index: 50;
  }
  .lb.open { display: flex; }
  .lb-stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .lb img { max-width: min(92vw, 560px); max-height: 84vh; border-radius: 8px; display: block; }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 46px; height: 46px; border-radius: 999px; border: none; cursor: pointer;
    background: rgba(255,255,255,.14); color: #fff; font-size: 24px; line-height: 1;
    display: none; align-items: center; justify-content: center;
  }
  .lb-nav:hover { background: rgba(255,255,255,.26); }
  .lb.is-carousel .lb-nav { display: flex; }
  .lb-prev { left: -60px; } .lb-next { right: -60px; }
  @media (max-width: 720px) { .lb-prev { left: 4px; } .lb-next { right: 4px; } }
  .lb-bar { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #fff; }
  .lb-caption { font-size: 14px; font-weight: 600; text-align: center; max-width: 90vw; }
  .lb-dots { display: none; gap: 7px; }
  .lb.is-carousel .lb-dots { display: flex; }
  .lb-dot { width: 8px; height: 8px; border-radius: 999px; background: rgba(255,255,255,.35); cursor: pointer; }
  .lb-dot.on { background: var(--yellow); }
  .lb-counter { font-size: 12px; color: rgba(255,255,255,.7); display: none; }
  .lb.is-carousel .lb-counter { display: block; }
  .lb-close { position: fixed; top: 16px; right: 20px; background: none; border: none; color: #fff; font-size: 30px; cursor: pointer; z-index: 51; }
</style>
</head>
<body>
  <header class="page">
    <h1>Criativos gerados</h1>
    <p>Biblioteca viva das peças produzidas pela ferramenta de criação (pipeline + direção de arte + vision-QA + crítico anti-slop). Peças individuais e carrosséis (séries de slides) — clique num carrossel pra navegar entre os slides.</p>
  </header>
  <div class="filters" id="filters">
    <button data-f="all" class="active">Todas</button>
    <button data-f="carousel">Carrosséis</button>
    <button data-f="metta">Metta</button>
    <button data-f="tiago">Tiago</button>
    <button data-f="story">Story</button>
    <button data-f="feed">Feed</button>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Nenhum criativo neste filtro ainda.</div>

  <div class="lb" id="lb">
    <button class="lb-close" id="lbclose" aria-label="Fechar">×</button>
    <div class="lb-stage">
      <button class="lb-nav lb-prev" id="lbprev" aria-label="Anterior">‹</button>
      <img id="lbimg" alt="">
      <button class="lb-nav lb-next" id="lbnext" aria-label="Próximo">›</button>
      <div class="lb-bar">
        <div class="lb-caption" id="lbcap"></div>
        <div class="lb-counter" id="lbcount"></div>
        <div class="lb-dots" id="lbdots"></div>
      </div>
    </div>
  </div>
<script>
(async function () {
  const grid = document.getElementById('grid');
  const lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg');
  const lbcap = document.getElementById('lbcap'), lbcount = document.getElementById('lbcount'), lbdots = document.getElementById('lbdots');
  let items = [];
  // Fonte primária: /api/creatives (curados versionados + salvos automáticos no KV).
  // Fallback: o JSON estático versionado (galeria segue funcionando sem o endpoint).
  try {
    const res = await fetch('/api/creatives', { cache: 'no-store' });
    if (!res.ok) throw new Error('endpoint ' + res.status);
    const data = await res.json();
    items = data.items || [];
  } catch (e) {
    try {
      const res2 = await fetch('../data/generated-index.json');
      items = (await res2.json()).items || [];
    } catch (e2) {
      document.getElementById('empty').hidden = false;
      document.getElementById('empty').textContent = 'Não consegui carregar os criativos.';
      return;
    }
  }
  items.sort((a, b) => (b.date || '').localeCompare(a.date || '') || a.id.localeCompare(b.id));
  function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  const isCar = it => it.type === 'carousel' && Array.isArray(it.slides) && it.slides.length > 0;
  const cover = it => isCar(it) ? it.slides[0].src : it.src;

  // ---- visualizador ----
  let cur = null, idx = 0;
  function openViewer(it) {
    cur = isCar(it) ? it.slides : [{ src: it.src, headline: it.headline }];
    idx = 0;
    lb.classList.toggle('is-carousel', cur.length > 1);
    if (cur.length > 1) {
      lbdots.innerHTML = cur.map((_, i) => `<span class="lb-dot" data-i="${i}"></span>`).join('');
    }
    show();
    lb.classList.add('open');
  }
  function show() {
    const s = cur[idx];
    lbimg.src = '../' + s.src;
    lbcap.textContent = s.headline || '';
    lbcount.textContent = (idx + 1) + ' / ' + cur.length;
    lbdots.querySelectorAll('.lb-dot').forEach((d, i) => d.classList.toggle('on', i === idx));
  }
  function go(n) { if (!cur) return; idx = (idx + n + cur.length) % cur.length; show(); }
  function close() { lb.classList.remove('open'); cur = null; }

  document.getElementById('lbprev').addEventListener('click', e => { e.stopPropagation(); go(-1); });
  document.getElementById('lbnext').addEventListener('click', e => { e.stopPropagation(); go(1); });
  document.getElementById('lbclose').addEventListener('click', close);
  lbdots.addEventListener('click', e => { const d = e.target.closest('.lb-dot'); if (d) { idx = +d.dataset.i; show(); } });
  lb.addEventListener('click', e => { if (e.target === lb || e.target.classList.contains('lb-stage')) close(); });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 'ArrowRight') go(1);
  });
  // swipe touch
  let tx = 0;
  lbimg.addEventListener('touchstart', e => { tx = e.changedTouches[0].clientX; }, { passive: true });
  lbimg.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
  }, { passive: true });

  const carIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="7" y="4" width="10" height="16" rx="1.5"/><path d="M4 8v8M20 8v8" stroke-linecap="round"/></svg>';

  function render(filter) {
    const list = items.filter(it =>
      filter === 'all' ? true :
      filter === 'carousel' ? isCar(it) :
      (filter === 'metta' || filter === 'tiago') ? it.brand === filter : it.format === filter);
    grid.innerHTML = list.map((it, i) => {
      const car = isCar(it);
      const badge = car ? `<span class="car-badge">${carIcon}${it.slides.length}</span>` : '';
      const carChip = car ? `<span class="chip is-carousel">carrossel · ${it.slides.length}</span>` : '';
      return `
      <figure class="card${car ? ' is-carousel' : ''}" data-i="${items.indexOf(it)}" style="margin:0">
        <div class="thumb">${badge}<img src="../${esc(cover(it))}" alt="${esc(it.headline)}" loading="lazy"></div>
        <div class="meta">
          <div class="chips">
            <span class="chip brand-${esc(it.brand)}">${esc(it.brand)}</span>
            ${carChip || `<span class="chip">${esc(it.model_id)}</span>`}
            <span class="chip">${esc(it.format)}</span>
            <span class="chip">${esc(it.date)}</span>
          </div>
          <h3>${esc(it.headline)}</h3>
          <div class="qa">${esc(it.qa)}${it.nota ? ' · ' + esc(it.nota) : ''}</div>
        </div>
      </figure>`;
    }).join('');
    const nCar = list.filter(isCar).length;
    document.getElementById('count').textContent =
      list.length + ' item' + (list.length === 1 ? '' : 's') + (nCar ? ` · ${nCar} ${nCar === 1 ? 'carrossel' : 'carrosséis'}` : '');
    document.getElementById('empty').hidden = list.length > 0;
    grid.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => openViewer(items[+c.dataset.i])));
  }

  document.getElementById('filters').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('active', x === b));
    render(b.dataset.f);
  });
  render('all');
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criativos gerados</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f6f6f3; --ink: #12181f; --ink-soft: #5d6672;
    --line: #e5e4de; --yellow: #ffc516; --dark: #12181f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #10161d; --surface: #171f28; --ink: #f2f4f6; --ink-soft: #97a2ae; --line: #26303b; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 24px 20px 64px;
  }
  header.page { max-width: 1180px; margin: 0 auto 20px; }
  header.page h1 { font-size: 22px; margin: 0 0 6px; font-weight: 800; }
  header.page p { margin: 0; color: var(--ink-soft); max-width: 70ch; }
  .filters { max-width: 1180px; margin: 0 auto 18px; display: flex; gap: 8px; flex-wrap: wrap; }
  .filters button {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .filters button.active { background: var(--yellow); border-color: var(--yellow); color: #12181f; }
  .count { max-width: 1180px; margin: 0 auto 12px; color: var(--ink-soft); font-size: 13px; }
  .grid {
    max-width: 1180px; margin: 0 auto; display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; display: flex; flex-direction: column; cursor: zoom-in;
  }
  .card img { width: 100%; height: auto; display: block; background: #22272e; }
  .card .meta { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font: 10.5px/1 ui-monospace, Menlo, monospace; padding: 4px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--ink-soft);
  }
  .chip.brand-metta { background: var(--yellow); border-color: var(--yellow); color: #12181f; font-weight: 700; }
  .chip.brand-tiago { background: var(--dark); border-color: var(--dark); color: #fff; font-weight: 700; }
  .card h3 { margin: 0; font-size: 13.5px; line-height: 1.35; font-weight: 700; }
  .card .qa { font-size: 11.5px; color: var(--ink-soft); }
  .empty { max-width: 1180px; margin: 40px auto; text-align: center; color: var(--ink-soft); }
  /* lightbox */
  .lb {
    position: fixed; inset: 0; background: rgba(10,13,17,.92); display: none;
    align-items: center; justify-content: center; padding: 24px; z-index: 50; cursor: zoom-out;
  }
  .lb.open { display: flex; }
  .lb img { max-width: min(92vw, 640px); max-height: 92vh; border-radius: 8px; }
</style>
</head>
<body>
  <header class="page">
    <h1>Criativos gerados</h1>
    <p>Biblioteca viva das peças produzidas pela ferramenta de criação (pipeline + direção de arte + vision-QA + crítico anti-slop). Diferente do Catálogo: aqui entra o que a máquina gerou, com veredito e contexto.</p>
  </header>
  <div class="filters" id="filters">
    <button data-f="all" class="active">Todas</button>
    <button data-f="metta">Metta</button>
    <button data-f="tiago">Tiago</button>
    <button data-f="story">Story</button>
    <button data-f="feed">Feed</button>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Nenhum criativo neste filtro ainda.</div>
  <div class="lb" id="lb"><img id="lbimg" alt=""></div>
<script>
(async function () {
  const grid = document.getElementById('grid');
  const lb = document.getElementById('lb');
  const lbimg = document.getElementById('lbimg');
  let items = [];
  try {
    const res = await fetch('../data/generated-index.json');
    items = (await res.json()).items || [];
  } catch (e) {
    document.getElementById('empty').hidden = false;
    document.getElementById('empty').textContent = 'Não consegui carregar data/generated-index.json';
    return;
  }
  items.sort((a, b) => (b.date || '').localeCompare(a.date || '') || a.id.localeCompare(b.id));

  function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function render(filter) {
    const list = items.filter(it =>
      filter === 'all' ? true :
      (filter === 'metta' || filter === 'tiago') ? it.brand === filter : it.format === filter);
    grid.innerHTML = list.map(it => `
      <figure class="card" data-src="../${esc(it.src)}" style="margin:0">
        <img src="../${esc(it.src)}" alt="${esc(it.headline)}" loading="lazy">
        <div class="meta">
          <div class="chips">
            <span class="chip brand-${esc(it.brand)}">${esc(it.brand)}</span>
            <span class="chip">${esc(it.model_id)}</span>
            <span class="chip">${esc(it.format)}</span>
            <span class="chip">${esc(it.date)}</span>
          </div>
          <h3>${esc(it.headline)}</h3>
          <div class="qa">${esc(it.qa)}${it.nota ? ' · ' + esc(it.nota) : ''}</div>
        </div>
      </figure>`).join('');
    document.getElementById('count').textContent = list.length + ' criativo' + (list.length === 1 ? '' : 's');
    document.getElementById('empty').hidden = list.length > 0;
    grid.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => {
      lbimg.src = c.dataset.src; lb.classList.add('open');
    }));
  }

  document.getElementById('filters').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('active', x === b));
    render(b.dataset.f);
  });
  lb.addEventListener('click', () => lb.classList.remove('open'));
  render('all');
})();
</script>
</body>
</html>

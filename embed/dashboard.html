<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard de Branding — Metta Brand System</title>

<link rel="stylesheet" href="../styles/tokens.css">

<style>
/* ============================================================
   DASHBOARD DE BRANDING — acompanhamento de marca
   Mini-app rodando dentro do iframe `embed:dashboard.html`.
   App-mode: altura fixa, scroll interno no .stage.
   Dados em MODO EXEMPLO — a camada de dados (data layer) está
   pronta pra ser plugada nas fontes reais (GA4, GSC, IG API,
   CRM, social listening). Cada métrica documenta como coletar.
============================================================ */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: var(--metta-sys-color-surface);
  color: var(--metta-sys-color-on-surface);
  font-family: var(--metta-ref-typeface-body), system-ui, sans-serif;
  font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body { display: flex; flex-direction: column; }

/* Semânticas locais de data-viz (não vão pro DS global) */
:root {
  --pos-text: #2F8F63;   --pos-bg: rgba(47, 143, 99, 0.12);
  --neg-text: #C2554E;   --neg-bg: rgba(194, 85, 78, 0.12);
  --neu-text: var(--metta-sys-color-on-surface-variant);
  --neu-bg: var(--metta-sys-color-surface-container);
  --src-auto: #2F8F63;   /* coleta automática (analytics/API)   */
  --src-tool: #C98A2E;   /* exige ferramenta (social listening) */
  --src-crm:  #4A78C4;   /* dado de CRM / vendas                */
}
[data-theme="dark"] {
  --pos-text: #5FC494;   --pos-bg: rgba(95, 196, 148, 0.15);
  --neg-text: #E08A83;   --neg-bg: rgba(224, 138, 131, 0.15);
}

/* ---------- STAGE ---------- */
.stage {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 32px clamp(18px, 4vw, 48px) 64px;
  max-width: 1240px; margin: 0 auto; width: 100%;
}

/* ---------- HEADER ---------- */
.dash-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 24px; flex-wrap: wrap; margin-bottom: 8px;
}
.dash-title {
  font-family: var(--metta-ref-typeface-display);
  font-size: clamp(30px, 4vw, 44px); font-weight: 870; font-stretch: 132%;
  line-height: 0.95; letter-spacing: -0.02em; margin: 0;
}
.dash-sub {
  color: var(--metta-sys-color-on-surface-variant);
  font-size: 15px; margin: 8px 0 0; max-width: 620px;
}
.period {
  display: inline-flex; gap: 2px; padding: 3px;
  background: var(--metta-sys-color-surface-container);
  border-radius: 999px;
}
.period button {
  border: none; background: transparent; cursor: pointer;
  font: inherit; font-size: 12.5px; font-weight: 600;
  padding: 7px 16px; border-radius: 999px; color: var(--metta-sys-color-on-surface-variant);
  transition: all 160ms var(--metta-ref-easing-standard);
}
.period button.active {
  background: var(--metta-sys-color-surface);
  color: var(--metta-sys-color-on-surface);
  box-shadow: var(--metta-sys-elevation-1);
}

/* ---------- STATUS BANNER ---------- */
.banner {
  display: flex; align-items: center; gap: 12px;
  margin: 22px 0 4px; padding: 12px 16px;
  background: var(--metta-sys-color-primary-container);
  color: var(--metta-sys-color-on-primary-container);
  border-radius: var(--metta-sys-shape-corner-md);
  font-size: 13.5px; line-height: 1.4;
}
.banner svg { flex: none; }

/* ---------- NORTH STAR HERO ---------- */
.hero {
  display: grid; grid-template-columns: auto 1fr; gap: clamp(20px, 4vw, 44px);
  align-items: center; margin: 28px 0 8px;
  padding: clamp(22px, 3vw, 34px);
  background: var(--metta-sys-color-surface-container-low);
  border: 1px solid var(--metta-sys-color-outline-variant);
  border-radius: var(--metta-sys-shape-corner-xl);
}
.hero-gauge { position: relative; width: 168px; height: 168px; }
.hero-gauge .pct {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
}
.hero-gauge .pct b {
  font-family: var(--metta-ref-typeface-display);
  font-size: 44px; font-weight: 870; font-stretch: 132%; line-height: 1;
}
.hero-gauge .pct span { font-size: 11px; color: var(--metta-sys-color-on-surface-variant); margin-top: 4px; letter-spacing: .04em; }
.hero-meta .kicker {
  font-size: 11px; font-weight: 650; font-stretch: 132%; letter-spacing: .14em;
  text-transform: uppercase; color: var(--metta-sys-color-primary);
  font-family: var(--metta-ref-typeface-display);
}
.hero-meta h2 {
  font-family: var(--metta-ref-typeface-display);
  font-size: clamp(24px, 3vw, 32px); font-weight: 650; font-stretch: 132%;
  line-height: 1.05; margin: 8px 0 10px;
}
.hero-meta p { margin: 0; color: var(--metta-sys-color-on-surface-variant); font-size: 14.5px; max-width: 560px; }
.hero-stats { display: flex; gap: 28px; margin-top: 18px; flex-wrap: wrap; }
.hero-stat .v { font-family: var(--metta-ref-typeface-display); font-size: 22px; font-weight: 700; font-stretch: 132%; }
.hero-stat .l { font-size: 11.5px; color: var(--metta-sys-color-on-surface-variant); text-transform: uppercase; letter-spacing: .06em; }

/* ---------- GROUP ---------- */
.group { margin-top: 36px; }
.group-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
.group-head h3 {
  font-family: var(--metta-ref-typeface-display);
  font-size: 18px; font-weight: 650; font-stretch: 132%; margin: 0;
}
.group-head .gloss { font-size: 13px; color: var(--metta-sys-color-on-surface-variant); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(264px, 1fr)); gap: 14px; }

/* ---------- CARD ---------- */
.card {
  position: relative; text-align: left; cursor: pointer; font: inherit;
  background: var(--metta-sys-color-surface-container-low);
  border: 1px solid var(--metta-sys-color-outline-variant);
  border-radius: var(--metta-sys-shape-corner-md);
  padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px;
  transition: border-color 160ms var(--metta-ref-easing-standard), transform 160ms var(--metta-ref-easing-standard), box-shadow 160ms;
}
.card:hover { border-color: var(--metta-sys-color-on-surface-variant); box-shadow: var(--metta-sys-elevation-2); transform: translateY(-1px); }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-name { font-size: 13px; font-weight: 600; color: var(--metta-sys-color-on-surface-variant); }
.src-dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
.card-val { display: flex; align-items: baseline; gap: 10px; }
.card-val b {
  font-family: var(--metta-ref-typeface-display);
  font-size: 30px; font-weight: 700; font-stretch: 132%; line-height: 1;
}
.delta {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 12px; font-weight: 650; padding: 2px 7px; border-radius: 999px;
}
.delta.up { color: var(--pos-text); background: var(--pos-bg); }
.delta.down { color: var(--neg-text); background: var(--neg-bg); }
.delta.flat { color: var(--neu-text); background: var(--neu-bg); }
.delta.inv-up { color: var(--neg-text); background: var(--neg-bg); }     /* sobe = ruim (ex CAC, churn) */
.delta.inv-down { color: var(--pos-text); background: var(--pos-bg); }   /* cai = bom */
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
.card-spark { height: 30px; }
.card-cad { font-size: 10.5px; color: var(--metta-sys-color-on-surface-variant); text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }

.tier-tag {
  position: absolute; top: 0; right: 0;
  font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  padding: 3px 8px; border-bottom-left-radius: var(--metta-sys-shape-corner-sm);
  background: var(--metta-sys-color-surface-container-high); color: var(--metta-sys-color-on-surface-variant);
}
.card.principal .tier-tag { background: var(--metta-sys-color-primary); color: var(--metta-sys-color-on-primary); }

/* ---------- LEGEND ---------- */
.legend { display: flex; gap: 20px; flex-wrap: wrap; margin: 30px 0 0; padding: 16px 18px;
  background: var(--metta-sys-color-surface-container-low); border-radius: var(--metta-sys-shape-corner-md);
  font-size: 12.5px; color: var(--metta-sys-color-on-surface-variant); }
.legend .li { display: inline-flex; align-items: center; gap: 7px; }

/* ---------- METHODOLOGY ---------- */
.method { margin-top: 30px; }
.method table { width: 100%; border-collapse: collapse; font-size: 13px; }
.method th, .method td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--metta-sys-color-outline-variant); vertical-align: top; }
.method th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--metta-sys-color-on-surface-variant); font-weight: 650; }
.method td b { font-weight: 600; }
.survey-note { margin-top: 16px; padding: 14px 16px; border-left: 3px solid var(--metta-sys-color-primary);
  background: var(--metta-sys-color-surface-container-low); border-radius: 0 var(--metta-sys-shape-corner-sm) var(--metta-sys-shape-corner-sm) 0;
  font-size: 13.5px; color: var(--metta-sys-color-on-surface); }

/* ---------- DRAWER ---------- */
.scrim { position: fixed; inset: 0; background: rgba(2,15,21,.42); opacity: 0; pointer-events: none;
  transition: opacity 220ms var(--metta-ref-easing-standard); z-index: 40; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(440px, 92vw);
  background: var(--metta-sys-color-surface); box-shadow: var(--metta-sys-elevation-5);
  transform: translateX(100%); transition: transform 260ms var(--metta-ref-easing-emphasized);
  z-index: 41; display: flex; flex-direction: column; }
.drawer.open { transform: translateX(0); }
.drawer-head { padding: 24px 24px 18px; border-bottom: 1px solid var(--metta-sys-color-outline-variant); }
.drawer-head .dk { font-size: 11px; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; color: var(--metta-sys-color-on-surface-variant); }
.drawer-head h4 { font-family: var(--metta-ref-typeface-display); font-size: 23px; font-weight: 700; font-stretch: 132%; margin: 6px 0 0; line-height: 1.05; }
.drawer-close { position: absolute; top: 20px; right: 20px; border: none; background: var(--metta-sys-color-surface-container);
  width: 34px; height: 34px; border-radius: 999px; cursor: pointer; display: grid; place-items: center; color: var(--metta-sys-color-on-surface); }
.drawer-body { padding: 22px 24px; overflow-y: auto; }
.drawer-body section { margin-bottom: 22px; }
.drawer-body h5 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--metta-sys-color-on-surface-variant); margin: 0 0 7px; font-weight: 650; }
.drawer-body p { margin: 0; font-size: 14px; line-height: 1.55; }
.drawer-body ol { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.6; }
.drawer-body ol li { margin-bottom: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
  padding: 5px 11px; border-radius: 999px; background: var(--metta-sys-color-surface-container); }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kv .box { background: var(--metta-sys-color-surface-container-low); border-radius: var(--metta-sys-shape-corner-sm); padding: 12px 14px; }
.kv .box .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--metta-sys-color-on-surface-variant); }
.kv .box .v { font-family: var(--metta-ref-typeface-display); font-size: 19px; font-weight: 700; font-stretch: 132%; margin-top: 3px; }

@media (max-width: 640px) {
  .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .hero-stats { justify-content: center; }
}
</style>
</head>
<body>

<div class="stage" id="stage"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<!-- ENV GUARD — desabilita em produção (mesma política da aba /criar) -->
<script>
(function envGuard() {
  const h = (location.hostname || '').toLowerCase();
  const isDev = h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0' || h.endsWith('.local');
  if (isDev) return;
  const stage = document.getElementById('stage');
  if (stage) {
    stage.innerHTML = `
      <div style="max-width: 540px; margin: 80px auto; padding: 40px; text-align: center;
                  color: var(--metta-sys-color-on-surface, #0C161B);">
        <h1 style="font-family: 'Zalando Sans Expanded', system-ui; font-size: 30px; margin: 0 0 16px; line-height: 1.15;">Dashboard de Branding em beta</h1>
        <p style="font-size: 16px; line-height: 1.5; color: var(--metta-sys-color-on-surface-variant, #435965); margin: 0 0 22px;">
          O painel de acompanhamento de marca está em construção com o time de tecnologia —
          disponível por enquanto só no ambiente local de desenvolvimento.
        </p>
        <p style="font-size: 14px; color: var(--metta-sys-color-on-surface-variant, #435965); margin: 0;">
          Em breve, com dados reais conectados.
        </p>
      </div>`;
  }
  throw new Error('dashboard.html: disabled in production (hostname=' + h + ')');
})();
</script>

<script>
/* ============================================================
   DATA LAYER — modo exemplo.
   Substituir `valueByPeriod` / `series` / `delta` pela ingestão
   real. Os campos `source`, `srcType`, `cadence`, `how` são a
   ESPECIFICAÇÃO de coleta que o time de tecnologia vai cablear.
============================================================ */
const ICONS = {
  info:   '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
  up:     '<polyline points="18 15 12 9 6 15"/>',
  down:   '<polyline points="6 9 12 15 18 9"/>',
  flat:   '<line x1="5" y1="12" x2="19" y2="12"/>',
  close:  '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'
};
function ic(name, size=16, sw=2.2) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;
}

const SRC_LABEL = {
  auto: 'Automática',
  tool: 'Exige ferramenta',
  crm:  'CRM / Vendas'
};
const SRC_COLOR = { auto: 'var(--src-auto)', tool: 'var(--src-tool)', crm: 'var(--src-crm)' };

const PERIODS = [
  { id: '30d', label: '30 dias' },
  { id: '90d', label: '90 dias' },
  { id: '12m', label: '12 meses' }
];

const NORTH_STAR = {
  name: 'Share of Search',
  pct: 34,
  delta: '+5pp',
  blurb: 'Fatia das buscas pela Metta versus os concorrentes da categoria. É o indicador automatizável mais preditivo de market share — quando sobe, a marca está ganhando espaço na mente antes de ganhar no mercado.',
  stats: [
    { v: '8,4k', l: 'buscas/mês pela marca' },
    { v: '+12%', l: 'volume vs. trimestre' },
    { v: '4', l: 'concorrentes monitorados' }
  ]
};

/* helper de série fake só pra sparkline (sobe levemente) */
function s(base, amp) { return Array.from({length:12}, (_,i)=> base + Math.round(Math.sin(i/2)*amp) + i*(amp/6)); }

const GROUPS = [
  { id:'awareness', title:'Consciência & Alcance', gloss:'o quanto a marca está presente na mente' },
  { id:'reputacao', title:'Percepção & Reputação', gloss:'o que o público sente sobre a marca' },
  { id:'comportamento', title:'Comportamento & Engajamento', gloss:'como o público interage com a marca' },
  { id:'financeiro', title:'Financeiro / Brand Equity', gloss:'o valor que a marca gera' },
  { id:'interno', title:'Saúde Interna de Marca', gloss:'consistência e adoção do sistema' }
];

const METRICS = [
  // ---------------- AWARENESS ----------------
  { id:'sov', group:'awareness', tier:'principal', name:'Share of Voice', srcType:'tool',
    valueByPeriod:{'30d':'22%','90d':'24%','12m':'21%'}, delta:'+3pp', dir:'up', series:s(20,3),
    source:'Social listening (mLabs / Stilingue / Brand24)', cadence:'mensal',
    measure:'Fatia das suas menções de marca/mídia em relação ao total da categoria (você + concorrentes).',
    how:['Configurar uma ferramenta de social listening monitorando "Metta" + termos dos concorrentes.','Exportar volume de menções por marca no período.','SOV = menções da Metta ÷ menções totais da categoria.','Conectar export via API/CSV ao data layer deste card.'] },

  { id:'branded-search', group:'awareness', tier:'principal', name:'Volume de Busca Branded', srcType:'auto',
    valueByPeriod:{'30d':'8,4k','90d':'24,1k','12m':'92k'}, delta:'+12%', dir:'up', series:s(700,90),
    source:'Google Search Console + Google Trends', cadence:'mensal',
    measure:'Quantas pessoas buscam ativamente pelo nome da marca. Demanda gerada — quem busca "Metta" já foi impactado.',
    how:['No GSC, filtrar Queries que contenham "metta".','Somar Impressões/Cliques dessas queries no período.','Cruzar tendência com Google Trends pra contexto sazonal.','Plugar a Search Console API (read-only) ao data layer.'] },

  { id:'reach', group:'awareness', tier:'secundaria', name:'Alcance Mensal', srcType:'auto',
    valueByPeriod:{'30d':'412k','90d':'1,2M','12m':'4,6M'}, delta:'+8%', dir:'up', series:s(380,40),
    source:'Instagram Graph API (Meta)', cadence:'mensal',
    measure:'Contas únicas alcançadas pelos perfis da marca. Topo de funil de awareness orgânico+pago.',
    how:['Conectar a Instagram Graph API (insights: reach).','Somar contas alcançadas por perfil no período.','Separar orgânico vs. pago pra leitura de eficiência.'] },

  // ---------------- REPUTAÇÃO ----------------
  { id:'sentiment', group:'reputacao', tier:'principal', name:'Brand Sentiment', srcType:'tool',
    valueByPeriod:{'30d':'78%','90d':'76%','12m':'74%'}, delta:'+4pp', dir:'up', series:s(72,4),
    source:'Social listening (análise de sentimento)', cadence:'mensal',
    measure:'% de menções classificadas como positivas (vs. neutras/negativas) em redes e avaliações.',
    how:['Coletar menções via social listening com classificação de sentimento.','Sentiment = menções positivas ÷ menções com polaridade.','Revisar amostra manualmente pra calibrar o classificador (PT-BR erra ironia).'] },

  { id:'reputation', group:'reputacao', tier:'principal', name:'Reputação (RA + Google)', srcType:'auto',
    valueByPeriod:{'30d':'8,6','90d':'8,5','12m':'8,3'}, delta:'+0,3', dir:'up', series:s(82,3),
    source:'Reclame Aqui + Google Business', cadence:'mensal',
    measure:'Índice composto de reputação pública. Em B2B de alto ticket, é o que reduz o atrito de confiança antes da venda.',
    how:['Capturar a nota e o status do Reclame Aqui (índice de resposta/solução).','Capturar a média de avaliações do Google Business Profile.','Compor num índice 0–10 ponderado (RA 60% / Google 40%).','RA não tem API oficial — usar scraping autorizado ou coleta manual mensal.'] },

  // ---------------- COMPORTAMENTO ----------------
  { id:'direct-traffic', group:'comportamento', tier:'principal', name:'Tráfego Direto + Branded', srcType:'auto',
    valueByPeriod:{'30d':'41%','90d':'38%','12m':'35%'}, delta:'+6pp', dir:'up', series:s(33,4),
    source:'GA4 + Google Search Console', cadence:'mensal',
    measure:'% de sessões que chegam por canal direto ou busca branded. O sinal comportamental mais puro de marca: quem digita o nome já foi "brandeado".',
    how:['No GA4, somar sessões de Direct + Organic com landing via query branded.','Dividir pelo total de sessões do período.','Cruzar com GSC pra isolar a parcela branded do orgânico.','Plugar a GA4 Data API (read-only).'] },

  { id:'engagement', group:'comportamento', tier:'principal', name:'Engajamento Real', srcType:'auto',
    valueByPeriod:{'30d':'6,1%','90d':'5,4%','12m':'4,8%'}, delta:'+1,1pp', dir:'up', series:s(48,5),
    source:'Instagram Graph API', cadence:'mensal',
    measure:'Salvamentos + compartilhamentos sobre alcance — não likes. Mede valor percebido, não vaidade.',
    how:['Coletar saves + shares por publicação via Graph API.','Engajamento real = (saves + shares) ÷ alcance.','Acompanhar a tendência, não o número absoluto de uma peça isolada.'] },

  { id:'returning', group:'comportamento', tier:'secundaria', name:'Visitantes Recorrentes', srcType:'auto',
    valueByPeriod:{'30d':'28%','90d':'26%','12m':'24%'}, delta:'+2pp', dir:'up', series:s(24,3),
    source:'GA4', cadence:'mensal',
    measure:'% de visitantes que retornam ao site. Marca forte cria hábito de retorno.',
    how:['No GA4, usar a dimensão New vs Returning users.','Recorrentes ÷ total de usuários no período.'] },

  { id:'dwell', group:'comportamento', tier:'secundaria', name:'Tempo em Conteúdo', srcType:'auto',
    valueByPeriod:{'30d':'1m48s','90d':'1m42s','12m':'1m35s'}, delta:'+14s', dir:'up', series:s(95,6),
    source:'GA4 (engagement time)', cadence:'mensal',
    measure:'Tempo médio de engajamento por sessão. Atenção sustentada é sinal de afinidade de marca.',
    how:['No GA4, usar Average engagement time per session.','Segmentar por conteúdo de marca vs. performance.'] },

  // ---------------- FINANCEIRO ----------------
  { id:'ltv-cac', group:'financeiro', tier:'principal', name:'Razão LTV:CAC', srcType:'crm',
    valueByPeriod:{'30d':'3,8x','90d':'3,6x','12m':'3,2x'}, delta:'+0,4', dir:'up', series:s(32,4),
    source:'CRM + plataformas de mídia', cadence:'trimestral',
    measure:'Relação entre valor do cliente e custo de aquisição. A RELAÇÃO é o sinal de brand equity — marca forte sobe a razão. Saudável ≥ 3x.',
    how:['Calcular LTV médio por cliente no CRM (ticket × ciclos × margem).','Calcular CAC = investimento total ÷ novos clientes do período.','Razão = LTV ÷ CAC. Acompanhar a tendência ao longo do rebranding.'] },

  { id:'cac', group:'financeiro', tier:'principal', name:'CAC', srcType:'crm', invert:true,
    valueByPeriod:{'30d':'R$ 1.240','90d':'R$ 1.310','12m':'R$ 1.420'}, delta:'-8%', dir:'down', series:s(140,-8),
    source:'Plataformas de mídia + CRM', cadence:'mensal',

  { id:'win-rate', group:'financeiro', tier:'secundaria', name:'Win Rate (marca citada)', srcType:'crm',
    valueByPeriod:{'30d':'31%','90d':'29%','12m':'27%'}, delta:'+5pp', dir:'up', series:s(27,4),
    source:'CRM (motivo de escolha)', cadence:'trimestral',

    how:['Adicionar campo "motivo da escolha" no fechamento do CRM.','Filtrar deals won que citam marca/reputação/indicação.','Win rate branded = esses ÷ total de oportunidades.'] },

  { id:'churn', group:'financeiro', tier:'secundaria', name:'Churn / Retenção', srcType:'crm', invert:true,
    valueByPeriod:{'30d':'4,1%','90d':'4,4%','12m':'5,0%'}, delta:'-0,6pp', dir:'down', series:s(46,-4),
    source:'CRM / billing', cadence:'mensal',
    measure:'% de clientes que cancelam. Marca forte tem churn menor — o cliente tolera mais erros e confia na empresa.',
    how:['No CRM, clientes perdidos ÷ base ativa no início do período.','Segmentar churn por safra (antes/depois do rebranding).'] },

  { id:'ltv', group:'financeiro', tier:'secundaria', name:'LTV Médio', srcType:'crm',
    valueByPeriod:{'30d':'R$ 14,2k','90d':'R$ 13,8k','12m':'R$ 13,0k'}, delta:'+9%', dir:'up', series:s(130,8),
    source:'CRM / billing', cadence:'trimestral',
    measure:'Valor total que um cliente gera ao longo da relação. Métrica de longo prazo — compare o antes e o depois do rebranding.',
    how:['LTV = ticket médio × nº médio de ciclos × margem.','Congelar o baseline pré-rebranding pra provar o delta depois.'] },

  // ---------------- INTERNO ----------------
  { id:'ds-adoption', group:'interno', tier:'principal', name:'% Peças usando o DS', srcType:'crm',
    valueByPeriod:{'30d':'68%','90d':'61%','12m':'48%'}, delta:'+14pp', dir:'up', series:s(48,8),
    source:'Tracking interno (Monday — KR 2.2)', cadence:'mensal',

    how:['No board Entregas (Monday), marcar cada peça como usa-DS sim/não.','Adoção = peças com DS ÷ total de peças entregues.','Espelhar (mirror) o valor do KR 2.2 já existente no board OKRs.'] }

/* ============================================================
   RENDER
============================================================ */
const STATE = { period: '30d' };

function spark(series, w=88, h=30, positive=true) {
  const min = Math.min(...series), max = Math.max(...series);
  const rng = (max - min) || 1;
  const pts = series.map((v,i)=>{
    const x = (i/(series.length-1))*w;
    const y = h - ((v-min)/rng)*(h-4) - 2;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const col = positive ? 'var(--pos-text)' : 'var(--neg-text)';
  const last = pts.split(' ').pop().split(',');
  return `<svg class="card-spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none" aria-hidden="true">
    <polyline points="${pts}" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.4" fill="${col}"/></svg>`;
}

function gauge(pct) {
  const r = 74, c = 2*Math.PI*r, off = c*(1-pct/100);
  return `<svg width="168" height="168" viewBox="0 0 168 168">
    <circle cx="84" cy="84" r="${r}" fill="none" stroke="var(--metta-sys-color-surface-container-high)" stroke-width="13"/>
    <circle cx="84" cy="84" r="${r}" fill="none" stroke="var(--metta-sys-color-primary)" stroke-width="13"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 84 84)"/></svg>`;
}

function deltaChip(m) {
  const dirClass = m.invert ? (m.dir==='down'?'inv-down':'inv-up') : (m.dir==='up'?'up':m.dir==='down'?'down':'flat');
  const arrow = m.dir==='up'?'up':m.dir==='down'?'down':'flat';
  return `<span class="delta ${dirClass}">${ic(arrow,12)}${m.delta}</span>`;
}

function cardHTML(m) {
  const goodTrend = m.invert ? m.dir==='down' : m.dir!=='down';
  return `<button class="card ${m.tier}" data-id="${m.id}">
    <span class="tier-tag">${m.tier==='principal'?'Principal':'Secundária'}</span>
    <div class="card-top">
      <span class="card-name">${m.name}</span>
      <span class="src-dot" title="${SRC_LABEL[m.srcType]}" style="background:${SRC_COLOR[m.srcType]}"></span>
    </div>
    <div class="card-val"><b>${m.valueByPeriod[STATE.period]}</b>${deltaChip(m)}</div>
    <div class="card-foot">${spark(m.series,88,30,goodTrend)}<span class="card-cad">${m.cadence}</span></div>
  </button>`;
}

function render() {
  const stage = document.getElementById('stage');
  const ns = NORTH_STAR;
  let html = `
    <div class="dash-head">
      <div>
        <h1 class="dash-title">Dashboard de Branding</h1>
        <p class="dash-sub">Acompanhamento de marca a curto, médio e longo prazo. Métricas automatizáveis — coletadas direto de analytics, APIs e CRM, sem depender de pesquisa manual.</p>
      </div>
      <div class="period" id="period">
        ${PERIODS.map(p=>`<button data-p="${p.id}" class="${STATE.period===p.id?'active':''}">${p.label}</button>`).join('')}
      </div>
    </div>

    <div class="banner">${ic('info',18)}<span><b>Modo exemplo.</b> Os valores são ilustrativos. Cada card já documenta a fonte e o método de coleta — o data layer está pronto pra ser conectado às fontes reais pelo time de tecnologia.</span></div>

    <div class="hero">
      <div class="hero-gauge">${gauge(ns.pct)}<div class="pct"><b>${ns.pct}%</b><span>SHARE OF SEARCH</span></div></div>
      <div class="hero-meta">
        <span class="kicker">★ North Star · indicador-mãe</span>
        <h2>${ns.name}</h2>
        <p>${ns.blurb}</p>
        <div class="hero-stats">
          ${ns.stats.map(st=>`<div class="hero-stat"><div class="v">${st.v}</div><div class="l">${st.l}</div></div>`).join('')}
        </div>
      </div>
    </div>`;

  GROUPS.forEach(g=>{
    const items = METRICS.filter(m=>m.group===g.id);
    if(!items.length) return;
    html += `<div class="group">
      <div class="group-head"><h3>${g.title}</h3><span class="gloss">${g.gloss}</span></div>
      <div class="grid">${items.map(cardHTML).join('')}</div>
    </div>`;
  });

  html += `
    <div class="legend">
      <span class="li"><span class="src-dot" style="background:var(--src-auto)"></span> Coleta automática (GA4, Search Console, IG API)</span>
      <span class="li"><span class="src-dot" style="background:var(--src-tool)"></span> Exige ferramenta (social listening)</span>
      <span class="li"><span class="src-dot" style="background:var(--src-crm)"></span> CRM / Vendas</span>
    </div>

    <div class="group method">
      <div class="group-head"><h3>Como cada dado chega aqui</h3><span class="gloss">fontes e cadência de coleta</span></div>
      <table>
        <thead><tr><th>Fonte</th><th>Alimenta</th><th>Método</th><th>Cadência</th></tr></thead>
        <tbody>
          <tr><td><b>Google Search Console</b></td><td>Share of Search, Busca Branded, Tráfego Branded</td><td>Search Console API (read-only) filtrando queries com a marca</td><td>Mensal</td></tr>
          <tr><td><b>Google Analytics 4</b></td><td>Tráfego direto, recorrência, tempo, conversão</td><td>GA4 Data API — canais, New vs Returning, engagement time</td><td>Mensal</td></tr>
          <tr><td><b>Instagram Graph API</b></td><td>Alcance, engajamento real (saves+shares)</td><td>Insights por perfil/publicação via token de longa duração</td><td>Mensal</td></tr>
          <tr><td><b>Social listening</b></td><td>Share of Voice, Brand Sentiment</td><td>mLabs / Stilingue / Brand24 — export CSV/API. <b>Único item que exige nova ferramenta paga.</b></td><td>Mensal</td></tr>
          <tr><td><b>Reclame Aqui + Google</b></td><td>Índice de Reputação</td><td>RA (scraping autorizado / manual) + Google Business API</td><td>Mensal</td></tr>
          <tr><td><b>CRM / billing</b></td><td>LTV, CAC, LTV:CAC, churn, win rate</td><td>Integração CRM + soma de investimento das plataformas de mídia</td><td>Mensal / trimestral</td></tr>
          <tr><td><b>Monday (Entregas/OKRs)</b></td><td>% peças usando o DS (KR 2.2)</td><td>Mirror do KR já existente no board OKRs</td><td>Mensal</td></tr>
        </tbody>
      </table>
      <div class="survey-note">
        <b>Fora deste painel (coleta por pesquisa):</b> Top of Mind, Recall espontâneo/estimulado, NPS, Associações de Marca e Consideração não são automatizáveis — dependem de um <b>brand tracker trimestral</b> (questionário curto, mesma amostra, recorrente). Esse ritual é o complemento humano da dashboard e onde mora boa parte do valor de longo prazo. Recomenda-se um segundo módulo "Pesquisa de Marca" pra registrar essas ondas.
      </div>
    </div>`;

  stage.innerHTML = html;

  document.getElementById('period').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    STATE.period = b.dataset.p; render();
  });
  stage.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click', ()=> openDrawer(c.dataset.id));
  });
}

/* ---------- DRAWER ---------- */
function openDrawer(id) {
  const m = METRICS.find(x=>x.id===id); if(!m) return;
  const g = GROUPS.find(x=>x.id===m.group);
  const drawer = document.getElementById('drawer');
  drawer.innerHTML = `
    <button class="drawer-close" id="dclose">${ic('close',18)}</button>
    <div class="drawer-head">
      <div class="dk">${g.title} · ${m.tier==='principal'?'Métrica principal':'Métrica secundária'}</div>
      <h4>${m.name}</h4>
    </div>
    <div class="drawer-body">
      <section>
        <span class="pill"><span class="src-dot" style="background:${SRC_COLOR[m.srcType]}"></span> ${SRC_LABEL[m.srcType]} · ${m.source}</span>
      </section>
      <section class="kv">
        <div class="box"><div class="l">Valor (${STATE.period})</div><div class="v">${m.valueByPeriod[STATE.period]}</div></div>
        <div class="box"><div class="l">Variação</div><div class="v">${m.delta}</div></div>
      </section>
      <section><h5>O que mede</h5><p>${m.measure}</p></section>
      <section><h5>Como coletar</h5><ol>${m.how.map(s=>`<li>${s}</li>`).join('')}</ol></section>
      <section><h5>Cadência</h5><p>${m.cadence.charAt(0).toUpperCase()+m.cadence.slice(1)}</p></section>
    </div>`;
  drawer.classList.add('open'); drawer.setAttribute('aria-hidden','false');
  document.getElementById('scrim').classList.add('open');
  document.getElementById('dclose').addEventListener('click', closeDrawer);
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer').setAttribute('aria-hidden','true');
  document.getElementById('scrim').classList.remove('open');
}
document.getElementById('scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });

render();
</script>

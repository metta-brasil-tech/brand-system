<div class="ad-canvas ad-dark-objeto" data-format="{{format}}" data-model="DARK-OBJETO">
  <div class="do-photo" style="background-image: url('{{image_url}}')"></div>
  <div class="do-overlay"></div>

  <div class="do-text">
    <h1 class="do-headline ad-text-expanded-heavy">{{headline}}</h1>
    {{#has_subhead}}<p class="do-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
    {{#has_body}}<p class="do-body ad-text-regular">{{body}}</p>{{/has_body}}
  </div>
  <div class="do-cta-wrap"><button class="ad-cta ad-cta--yellow">{{cta}}</button></div>
</div>

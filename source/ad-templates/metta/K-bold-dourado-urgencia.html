<div class="ad-canvas ad-k-bold-dourado" data-format="{{format}}" data-model="K-bold-dourado-urgencia">
  <div class="kbd-text">
    <h1 class="kbd-headline ad-text-expanded-heavy">{{headline}}</h1>
    <div class="kbd-divider"></div>
    {{#has_subhead}}<p class="kbd-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
    {{#has_body}}<p class="kbd-body ad-text-regular">{{body}}</p>{{/has_body}}
  </div>
  <div class="kbd-cta-wrap"><button class="ad-cta ad-cta--yellow">{{cta}}</button></div>
</div>

<div class="ad-canvas ad-c-tipo-pura" data-format="{{format}}" data-model="C-tipografia-pura-dark">
  <div class="ctp-text">
    <h1 class="ctp-headline ad-text-expanded-heavy">{{headline}}</h1>
    {{#has_subhead}}<p class="ctp-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
    {{#has_body}}<p class="ctp-body ad-text-regular">{{body}}</p>{{/has_body}}
  </div>
  {{#has_cta}}<div class="ctp-cta-wrap"><button class="ad-cta ad-cta--yellow">{{cta}}</button></div>{{/has_cta}}
</div>

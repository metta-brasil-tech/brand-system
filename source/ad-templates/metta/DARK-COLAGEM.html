<div class="ad-canvas ad-dark-colagem" data-format="{{format}}" data-model="DARK-COLAGEM">
  <div class="dco-photo" style="background-image: url('{{image_url}}')"></div>
  <div class="dco-yellow-accent"></div>

  <div class="dco-text">
    <h1 class="dco-headline ad-text-expanded-heavy">{{headline}}</h1>
    {{#has_subhead}}<p class="dco-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
    {{#has_body}}<p class="dco-body ad-text-regular">{{body}}</p>{{/has_body}}
  </div>
  <div class="dco-cta-wrap"><button class="ad-cta ad-cta--yellow">{{cta}}</button></div>
</div>

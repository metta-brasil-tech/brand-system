<div class="ad-canvas ad-d-fullbleed" data-format="{{format}}" data-model="D-foto-fullbleed-overlay">
  <div class="dfb-photo" style="background-image: url('{{image_url}}')"></div>
  <div class="dfb-overlay"></div>

  <div class="dfb-text">
    <h1 class="dfb-headline ad-text-expanded-heavy">{{headline}}</h1>
    {{#has_subhead}}<p class="dfb-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
    {{#has_body}}<p class="dfb-body ad-text-regular">{{body}}</p>{{/has_body}}
  </div>

  <div class="dfb-cta-wrap">
    <button class="ad-cta ad-cta--yellow">{{cta}}</button>
  </div>
</div>

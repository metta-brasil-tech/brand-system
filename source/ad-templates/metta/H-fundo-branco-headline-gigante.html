<div class="ad-canvas ad-h-headline-gigante" data-format="{{format}}" data-model="H-fundo-branco-headline-gigante">
  <div class="hhg-text">
    <h1 class="hhg-headline ad-text-expanded-heavy">{{headline}}</h1>
    {{#has_subhead}}<p class="hhg-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
    {{#has_body}}<p class="hhg-body ad-text-regular">{{body}}</p>{{/has_body}}
  </div>
  {{#has_cta}}<div class="hhg-cta-wrap"><button class="ad-cta ad-cta--dark">{{cta}}</button></div>{{/has_cta}}
</div>

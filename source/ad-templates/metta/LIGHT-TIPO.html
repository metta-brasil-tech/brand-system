<div class="ad-canvas ad-light-tipo" data-format="{{format}}" data-model="LIGHT-TIPO">
  <div class="lt-text">
    <h1 class="lt-headline ad-text-expanded-heavy">{{headline}}</h1>
    {{#has_subhead}}<p class="lt-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
    {{#has_body}}<p class="lt-body ad-text-regular">{{body}}</p>{{/has_body}}
  </div>
  {{#has_cta}}<div class="lt-cta-wrap"><button class="ad-cta ad-cta--dark">{{cta}}</button></div>{{/has_cta}}
</div>

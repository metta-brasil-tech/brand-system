<div class="ad-canvas ad-i-retrato-pb" data-format="{{format}}" data-model="I-retrato-editorial-pb">
  <div class="irpb-photo" style="background-image: url('{{image_url}}')"></div>
  <div class="irpb-text">
    <h1 class="irpb-headline ad-text-expanded-heavy">{{headline}}</h1>
    {{#has_subhead}}<p class="irpb-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
    {{#has_body}}<p class="irpb-body ad-text-regular">{{body}}</p>{{/has_body}}
  </div>
  <div class="irpb-cta-wrap"><button class="ad-cta ad-cta--yellow">{{cta}}</button></div>
</div>

<div class="ad-canvas ad-yellow-frame" data-format="{{format}}" data-model="YELLOW-FRAME">
  <div class="yf-frame">
    <div class="yf-content">
      <h1 class="yf-headline ad-text-expanded-heavy">{{headline}}</h1>
      {{#has_subhead}}<p class="yf-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
      {{#has_body}}<p class="yf-body ad-text-regular">{{body}}</p>{{/has_body}}
      <div class="yf-cta-wrap"><button class="ad-cta ad-cta--yellow">{{cta}}</button></div>
    </div>
  </div>
</div>

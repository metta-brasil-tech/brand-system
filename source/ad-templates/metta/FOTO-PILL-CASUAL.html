<div class="ad-canvas ad-foto-pill-casual" data-format="{{format}}" data-model="FOTO-PILL-CASUAL">
  <div class="fpc-photo" style="background-image: url('{{image_url}}')"></div>
  <div class="fpc-overlay"></div>
  <div class="fpc-text">
    <h1 class="fpc-headline ad-text-expanded-heavy">{{headline}}</h1>
    {{#has_subhead}}<p class="fpc-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
    {{#has_body}}<p class="fpc-body ad-text-regular">{{body}}</p>{{/has_body}}
  </div>
  <div class="fpc-cta-wrap"><button class="ad-cta ad-cta--yellow">{{cta}}</button></div>
</div>

<div class="ad-canvas ad-yellow-editorial" data-format="{{format}}" data-model="YELLOW-EDITORIAL">

  <div class="ye-content">
    <h1 class="ye-headline ad-text-expanded-heavy">{{headline}}</h1>
    {{#has_subhead}}<p class="ye-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
    {{#has_body}}<p class="ye-body ad-text-regular">{{body}}</p>{{/has_body}}
  </div>

  <div class="ye-cta-wrap">
    <button class="ad-cta ad-cta--yellow">{{cta}}</button>
  </div>

</div>

<div class="ad-canvas ad-dark-carta" data-format="{{format}}" data-model="DARK-CARTA">
  <div class="dc-card">
    <p class="dc-eyebrow ad-text-expanded-bold">CONVITE RESERVADO</p>
    <div class="dc-divider"></div>
    <h1 class="dc-headline ad-text-expanded-heavy">{{headline}}</h1>
    {{#has_subhead}}<p class="dc-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
    {{#has_body}}<p class="dc-body ad-text-regular">{{body}}</p>{{/has_body}}
    <div class="dc-cta-wrap"><button class="ad-cta ad-cta--yellow">{{cta}}</button></div>
  </div>
</div>

<div class="ad-canvas ad-logo-wall" data-format="{{format}}" data-model="LOGO-WALL">
  <p class="lw-eyebrow ad-text-expanded-bold">+1.000 EMPRESAS</p>

  <h1 class="lw-headline ad-text-expanded-heavy">{{headline}}</h1>
  {{#has_subhead}}<p class="lw-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}

  <!-- Grid de logos (placeholders neutros — em prod o user adiciona logos reais) -->
  <div class="lw-grid">
    <div class="lw-logo">SICREDI</div>
    <div class="lw-logo">VIVO</div>
    <div class="lw-logo">PANVEL</div>
    <div class="lw-logo">KORIN</div>
    <div class="lw-logo">HIPERZOO</div>
    <div class="lw-logo">CBA</div>
    <div class="lw-logo">AMBI</div>
    <div class="lw-logo">METTA</div>
  </div>

  {{#has_body}}<p class="lw-body ad-text-regular">{{body}}</p>{{/has_body}}
  <div class="lw-cta-wrap"><button class="ad-cta ad-cta--yellow">{{cta}}</button></div>
</div>

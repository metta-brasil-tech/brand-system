<div class="ad-canvas ad-light-surreal" data-format="{{format}}" data-model="LIGHT-SURREAL">
  <!-- Foto surreal (figura com objeto incongruente) — centro vertical -->
  <div class="lsr-photo" style="background-image: url('{{image_url}}')"></div>

  <div class="lsr-text">
    <h1 class="lsr-headline ad-text-expanded-heavy">{{headline}}</h1>
    {{#has_subhead}}<p class="lsr-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
    {{#has_body}}<p class="lsr-body ad-text-regular">{{body}}</p>{{/has_body}}
  </div>
  <div class="lsr-cta-wrap"><button class="ad-cta ad-cta--yellow">{{cta}}</button></div>
</div>

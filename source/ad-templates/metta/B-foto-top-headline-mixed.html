<div class="ad-canvas ad-b-foto-top" data-format="{{format}}" data-model="B-foto-top-headline-mixed">
  <div class="bft-photo" style="background-image: url('{{image_url}}')"></div>
  <div class="bft-text">
    <h1 class="bft-headline ad-text-expanded-heavy">{{headline}}</h1>
    {{#has_subhead}}<p class="bft-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
    {{#has_body}}<p class="bft-body ad-text-regular">{{body}}</p>{{/has_body}}
  </div>
  <div class="bft-cta-wrap"><button class="ad-cta ad-cta--yellow">{{cta}}</button></div>
</div>

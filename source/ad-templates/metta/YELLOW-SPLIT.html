<div class="ad-canvas ad-yellow-split" data-format="{{format}}" data-model="YELLOW-SPLIT">
  <div class="ys-photo" style="background-image: url('{{image_url}}')"></div>
  <div class="ys-yellow-half">
    <div class="ys-content">
      <h1 class="ys-headline ad-text-expanded-heavy">{{headline}}</h1>
      {{#has_subhead}}<p class="ys-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
      {{#has_body}}<p class="ys-body ad-text-regular">{{body}}</p>{{/has_body}}
      <div class="ys-cta-wrap"><button class="ad-cta ad-cta--dark">{{cta}}</button></div>
    </div>
  </div>
</div>

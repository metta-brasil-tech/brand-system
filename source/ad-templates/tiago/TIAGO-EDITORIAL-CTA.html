<div class="ad-canvas ad-tiago-ed-cta" data-format="{{format}}" data-model="TIAGO-EDITORIAL-CTA">
  <div class="tecta-text">
    <h1 class="tecta-headline ad-text-bold">{{headline}}</h1>
    {{#has_subhead}}<p class="tecta-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
    {{#has_body}}<p class="tecta-body ad-text-regular">{{body}}</p>{{/has_body}}
  </div>
  <div class="tecta-cta-wrap"><button class="ad-cta ad-cta--tiago-yellow">{{cta|Saiba mais}}</button></div>
</div>

<div class="ad-canvas ad-tiago-typo" data-format="{{format}}" data-model="TIAGO-TYPO-PURE">
  <div class="tt-text">
    <h1 class="tt-headline ad-text-bold">{{headline}}</h1>
    {{#has_subhead}}<p class="tt-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
    {{#has_body}}<p class="tt-body ad-text-regular">{{body}}</p>{{/has_body}}
  </div>
  {{#has_cta}}<p class="tt-cta ad-text-regular">{{cta}} 👉</p>{{/has_cta}}
</div>

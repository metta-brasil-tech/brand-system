<div class="ad-canvas ad-tiago-ed-card" data-format="{{format}}" data-model="TIAGO-EDITORIAL-CARD">
  <div class="tec-photo" style="background-image: url('{{image_url}}')"></div>
  <div class="tec-overlay"></div>
  <div class="tec-text">
    <h1 class="tec-headline ad-text-bold">{{headline}}</h1>
    {{#has_subhead}}<p class="tec-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
    {{#has_body}}<p class="tec-body ad-text-regular">{{body}}</p>{{/has_body}}
  </div>
</div>

<div class="ad-canvas ad-tiago-yellow-block" data-format="{{format}}" data-model="TIAGO-STORY-YELLOW-BLOCK">
  <div class="tyb-photo" style="background-image: url('{{image_url}}')"></div>
  <div class="tyb-overlay"></div>
  <div class="tyb-block">
    <h1 class="tyb-headline ad-text-bold">{{headline}}</h1>
    {{#has_subhead}}<p class="tyb-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
    {{#has_body}}<p class="tyb-body ad-text-regular">{{body}}</p>{{/has_body}}
  </div>
  {{#has_cta}}<div class="tyb-cta-wrap"><button class="ad-cta ad-cta--tiago-yellow">{{cta}}</button></div>{{/has_cta}}
</div>

<div class="ad-canvas ad-tiago-minimal" data-format="{{format}}" data-model="TIAGO-STORY-MINIMAL-QUESTION">
  <div class="tmq-photo" style="background-image: url('{{image_url}}')"></div>
  <div class="tmq-overlay"></div>
  <div class="tmq-text">
    <h1 class="tmq-headline ad-text-regular">{{headline}}</h1>
    {{#has_subhead}}<p class="tmq-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
  </div>
</div>

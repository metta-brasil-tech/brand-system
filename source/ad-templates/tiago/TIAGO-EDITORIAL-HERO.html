<div class="ad-canvas ad-tiago-editorial-hero" data-format="{{format}}" data-model="TIAGO-EDITORIAL-HERO">

  <!-- Foto bleed full canvas -->
  <div class="teh-photo" style="background-image: url('{{image_url}}')"></div>

  <!-- Eyebrows top-left + top-right -->
  <div class="teh-eyebrows">
    <p class="teh-eyebrow-left ad-text-bold">ESTRATÉGIAS DE GESTÃO DE VENDAS</p>
    <p class="teh-eyebrow-right ad-text-bold">VENDAS É CIÊNCIA</p>
  </div>

  <!-- Headline gigante center-vertical -->
  <div class="teh-text">
    <h1 class="teh-headline ad-text-bold">{{headline}}</h1>
    {{#has_subhead}}<p class="teh-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
    {{#has_body}}<p class="teh-body ad-text-regular">{{body}}</p>{{/has_body}}
  </div>

  <!-- CTA pill amarelo bottom-left -->
  <div class="teh-cta-wrap">
    <button class="ad-cta ad-cta--tiago-yellow">{{cta|Arrasta pro lado}}</button>
  </div>

</div>

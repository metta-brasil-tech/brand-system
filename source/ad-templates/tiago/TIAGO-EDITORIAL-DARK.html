<div class="ad-canvas ad-tiago-ed-dark" data-format="{{format}}" data-model="TIAGO-EDITORIAL-DARK">
  <div class="ted-photo" style="background-image: url('{{image_url}}')"></div>
  <div class="ted-overlay"></div>
  <div class="ted-text">
    <h1 class="ted-headline ad-text-bold">{{headline}}</h1>
    {{#has_subhead}}<p class="ted-subhead ad-text-regular">{{subhead}}</p>{{/has_subhead}}
    {{#has_body}}<p class="ted-body ad-text-regular">{{body}}</p>{{/has_body}}
  </div>
</div>

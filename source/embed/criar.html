<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criar — Metta Brand System</title>

<link rel="stylesheet" href="../styles/tokens.css">

<style>
/* ============================================================
   CRIAR — UI do gerador de anúncio/carrossel/post
   Mini-app rodando dentro do iframe `embed:criar.html`.
   Estado em memória. Mock de geração (engine real entra na fase 2).
============================================================ */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--metta-sys-color-surface);
  color: var(--metta-sys-color-on-surface);
  font-family: var(--metta-ref-typeface-body), system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* App-mode: altura fixa, scroll INTERNO no .stage.
   App.js (parent) força iframe height: calc(100vh - topbar) e .stage controla próprio scroll
   pra footer sticky funcionar de verdade. */
html, body {
  height: 100%;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
}

/* ----------------------------------------- *
 * STAGE — container que troca de step       *
 * ----------------------------------------- */
.stage {
  flex: 1;
  min-height: 0;            /* permite que flex-child encolha e overflow funcione */
  overflow-y: auto;         /* scroll interno — footer sticky bottom ancora aqui */
  display: flex;
  flex-direction: column;
  padding: 32px clamp(20px, 4vw, 56px) 0;
  max-width: 1100px;
  margin: 0 auto;
  width: 100%;
}

/* ----------------------------------------- *
 * STEPPER                                   *
 * ----------------------------------------- */
.stepper {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}

.stepper-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 999px;
  font: inherit;
  font-size: 10.5px;
  font-weight: 590;
  font-stretch: 132%;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--metta-sys-color-on-surface-variant);
  background: transparent;
  border: 1px solid transparent;
  transition: all 180ms var(--metta-ref-easing-standard);
  cursor: default;
}

button.stepper-item { cursor: pointer; }

.stepper-item.active {
  color: var(--metta-sys-color-on-primary);
  background: var(--metta-sys-color-primary);
  border-color: var(--metta-sys-color-primary);
}

.stepper-item.done {
  color: var(--metta-sys-color-on-surface-variant);
  background: transparent;
  border-color: var(--metta-sys-color-outline-variant);
}

button.stepper-item.done:hover {
  background: var(--metta-sys-color-surface-container);
  border-color: var(--metta-sys-color-on-surface-variant);
  color: var(--metta-sys-color-on-surface);
}

.stepper-arrow {
  color: var(--metta-sys-color-on-surface-variant);
  opacity: 0.4;
  font-size: 12px;
  line-height: 1;
}

/* ----------------------------------------- *
 * HEADER do step (título + subtítulo)       *
 * ----------------------------------------- */
.step-head {
  margin-bottom: 32px;
}

.step-eyebrow {
  font-size: 11px;
  font-weight: 590;
  font-stretch: 132%;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--metta-sys-color-on-surface-variant);
  margin: 0 0 12px;
}

.step-title {
  font-family: var(--metta-ref-typeface-brand), var(--metta-ref-typeface-fallback-expanded), sans-serif;
  font-weight: 650;
  font-stretch: 132%;
  font-size: clamp(28px, 4vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin: 0 0 12px;
  color: var(--metta-sys-color-on-surface);
}

.step-sub {
  font-size: 17px;
  line-height: 1.45;
  color: var(--metta-sys-color-on-surface-variant);
  max-width: 56ch;
  margin: 0;
}

/* ----------------------------------------- *
 * BODY (conteúdo do step)                   *
 * ----------------------------------------- */
.step-body {
  flex: 1;
}

/* ----------------------------------------- *
 * GRID de cards (escolha)                   *
 * ----------------------------------------- */
.choice-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}

.choice-grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); max-width: 720px; }

.choice {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 14px;
  padding: 24px;
  border-radius: var(--metta-sys-shape-corner-lg);
  background: var(--metta-sys-color-surface-container-low);
  border: 1.5px solid var(--metta-sys-color-outline-variant);
  cursor: pointer;
  text-align: left;
  font: inherit;
  color: inherit;
  transition: all 200ms var(--metta-ref-easing-standard);
  overflow: hidden;
}

.choice::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--metta-sys-color-primary);
  opacity: 0;
  transition: opacity 200ms;
  pointer-events: none;
}

.choice > * { position: relative; z-index: 1; }

.choice:hover {
  border-color: var(--metta-sys-color-on-surface-variant);
  transform: translateY(-2px);
  box-shadow: var(--metta-sys-elevation-2);
}

.choice:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px var(--metta-sys-color-surface), 0 0 0 4px var(--metta-sys-color-on-surface-variant);
}

.choice.selected {
  background: var(--metta-sys-color-surface-container-low);
  border-color: var(--metta-sys-color-on-surface-variant);
}

.choice-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  border-radius: var(--metta-sys-shape-corner-md);
  background: var(--metta-sys-color-surface-container);
  color: var(--metta-sys-color-on-surface);
}

.choice-icon svg { width: 24px; height: 24px; }

/* Preview de estilo — imagem real do exemplar canônico */
.choice.with-preview { padding: 0; overflow: hidden; }
.choice-preview {
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
  object-position: center top;
  border-radius: 0;
  background: var(--metta-sys-color-surface-container);
  display: block;
}
.choice-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px 18px 20px;
}
.choice-body .choice-title { font-size: 16px; line-height: 1.2; }
.choice-body .choice-desc  { font-size: 13px; line-height: 1.4; }
.choice-body .choice-tag   { align-self: flex-start; margin-top: 4px; }

/* Galeria de imagens da busca web (fase B) */
.search-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-top: 16px;
}
.search-result {
  appearance: none;
  background: var(--metta-sys-color-surface-container-low);
  border: 1.5px solid var(--metta-sys-color-outline-variant);
  border-radius: var(--metta-sys-shape-corner-md);
  padding: 0;
  cursor: pointer;
  overflow: hidden;
  transition: all 180ms var(--metta-ref-easing-standard);
}
.search-result:hover {
  border-color: var(--metta-sys-color-on-surface-variant);
  transform: translateY(-2px);
  box-shadow: var(--metta-sys-elevation-2);
}
.search-result.selected {
  background: var(--metta-sys-color-surface-container-low);
  border-color: var(--metta-sys-color-on-surface-variant);
  border-width: 2px;
}
.search-result img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
}
.search-empty, .search-loading {
  padding: 32px;
  text-align: center;
  color: var(--metta-sys-color-on-surface-variant);
  font-size: 14px;
  background: var(--metta-sys-color-surface-container-low);
  border-radius: var(--metta-sys-shape-corner-md);
  margin-top: 16px;
}

.choice-title {
  font-family: var(--metta-ref-typeface-brand), var(--metta-ref-typeface-fallback-expanded), sans-serif;
  font-weight: 650;
  font-stretch: 132%;
  font-size: 22px;
  letter-spacing: -0.01em;
  margin: 0;
}

.choice-desc {
  font-size: 14px;
  line-height: 1.45;
  color: var(--metta-sys-color-on-surface-variant);
  margin: 0;
}

.choice-tag {
  font-size: 11px;
  font-weight: 590;
  font-stretch: 132%;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--metta-sys-color-on-surface-variant);
  background: var(--metta-sys-color-surface-container);
  padding: 4px 10px;
  border-radius: 999px;
}

/* Brand cards — única exceção: ícone reproduz a paleta da PRÓPRIA marca (símbolo). */
.choice.brand-metta .choice-icon { background: var(--metta-sys-color-primary); color: var(--metta-sys-color-on-primary); }
.choice.brand-tiago .choice-icon { background: var(--metta-ref-palette-night-10); color: var(--metta-sys-color-primary); }

/* Em breve — card desabilitado com badge */
.choice.coming-soon {
  opacity: 0.55;
  cursor: not-allowed;
  pointer-events: none;
}
.choice.coming-soon::after {
  content: 'Em breve';
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 10;
  font-size: 10px;
  font-weight: 620;
  font-stretch: 132%;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--metta-sys-color-on-surface-variant);
  background: var(--metta-sys-color-surface-container);
  border: 1px solid var(--metta-sys-color-outline-variant);
  padding: 3px 8px;
  border-radius: 999px;
}

/* ----------------------------------------- *
 * FORM CONTROLS                             *
 * ----------------------------------------- */
.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 24px;
}

.field-label {
  font-size: 13px;
  font-weight: 590;
  font-stretch: 132%;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--metta-sys-color-on-surface-variant);
}
.copy-count {
  float: right;
  font-size: 12px;
  font-weight: 500;
  font-stretch: 100%;
  letter-spacing: 0;
  text-transform: none;
  font-variant-numeric: tabular-nums;
}

.field-hint {
  font-size: 13px;
  color: var(--metta-sys-color-on-surface-variant);
  margin: 0;
}

.input, .textarea {
  width: 100%;
  padding: 14px 16px;
  border-radius: var(--metta-sys-shape-corner-md);
  border: 1.5px solid var(--metta-sys-color-outline-variant);
  background: var(--metta-sys-color-surface);
  color: var(--metta-sys-color-on-surface);
  font: inherit;
  font-size: 16px;
  transition: border-color 200ms, box-shadow 200ms;
  resize: vertical;
}

.input:focus, .textarea:focus {
  outline: none;
  border-color: var(--metta-sys-color-on-surface-variant);
}

.textarea { min-height: 160px; font-family: inherit; line-height: 1.5; }

.toggle-group {
  display: inline-flex;
  background: var(--metta-sys-color-surface-container);
  padding: 4px;
  border-radius: var(--metta-sys-shape-corner-md);
  gap: 4px;
}

.toggle-group button {
  appearance: none;
  background: transparent;
  border: none;
  font: inherit;
  font-size: 14px;
  font-weight: 510;
  color: var(--metta-sys-color-on-surface-variant);
  padding: 8px 16px;
  border-radius: var(--metta-sys-shape-corner-sm);
  cursor: pointer;
  transition: all 150ms;
}

.toggle-group button.active {
  background: var(--metta-sys-color-surface);
  color: var(--metta-sys-color-on-surface);
  box-shadow: var(--metta-sys-elevation-1);
}

/* CTA chips — sugestões clicáveis */
.cta-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.cta-chip {
  appearance: none;
  background: var(--metta-sys-color-surface-container-low);
  border: 1.5px solid var(--metta-sys-color-outline-variant);
  border-radius: 999px;
  padding: 8px 16px;
  font: inherit;
  font-size: 13px;
  font-weight: 510;
  color: var(--metta-sys-color-on-surface);
  cursor: pointer;
  transition: all 150ms;
}
.cta-chip:hover {
  background: var(--metta-sys-color-surface-container);
  border-color: var(--metta-sys-color-on-surface-variant);
}
.cta-chip.active {
  background: var(--metta-sys-color-surface-container-low);
  border-color: var(--metta-sys-color-on-surface-variant);
  font-weight: 590;
}

/* ----------------------------------------- *
 * SUMMARY (confirmação)                     *
 * ----------------------------------------- */
.summary {
  background: var(--metta-sys-color-surface-container-low);
  border: 1px solid var(--metta-sys-color-outline-variant);
  border-radius: var(--metta-sys-shape-corner-lg);
  padding: 24px;
  margin-bottom: 24px;
}

.summary-row {
  display: grid;
  grid-template-columns: 140px 1fr auto;
  align-items: start;
  gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid var(--metta-sys-color-outline-variant);
}

.summary-row:last-child { border-bottom: none; }

.summary-key {
  font-size: 11px;
  font-weight: 590;
  font-stretch: 132%;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--metta-sys-color-on-surface-variant);
  padding-top: 2px;
}

.summary-val {
  font-size: 16px;
  color: var(--metta-sys-color-on-surface);
  line-height: 1.45;
}

.summary-edit {
  appearance: none;
  background: transparent;
  border: 1px solid var(--metta-sys-color-outline-variant);
  border-radius: 999px;
  padding: 4px 12px;
  font: inherit;
  font-size: 12px;
  color: var(--metta-sys-color-on-surface-variant);
  cursor: pointer;
  transition: all 150ms;
}

.summary-edit:hover {
  border-color: var(--metta-sys-color-on-surface-variant);
  color: var(--metta-sys-color-on-surface);
}

/* ----------------------------------------- *
 * FOOTER (navegação) — sempre visível       *
 * ----------------------------------------- */
.foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 0;
  margin-top: 24px;
  border-top: 1px solid var(--metta-sys-color-outline-variant);
  position: sticky;
  bottom: 0;
  background: var(--metta-sys-color-surface);
  /* Faz o footer "flutuar" sobre o conteúdo quando o user dá scroll —
     blur+shadow sutil reforça que é uma camada de UI fixa */
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 10;
}

/* Em telas grandes onde o conteúdo cabe, o footer fica colado no final
   (sem sticky redundante). Em telas pequenas/conteúdo longo, sticky atua. */
.step-body {
  flex: 1;
  padding-bottom: 8px;
}

.btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 20px;
  border-radius: var(--metta-sys-shape-corner-md);
  font: inherit;
  font-size: 15px;
  font-weight: 590;
  cursor: pointer;
  transition: all 150ms;
  border: 1.5px solid transparent;
}

.btn-primary {
  background: var(--metta-sys-color-primary);
  color: var(--metta-sys-color-on-primary);
}

.btn-primary:hover:not(:disabled) {
  background: var(--metta-sys-color-primary-hover);
  transform: translateY(-1px);
  box-shadow: var(--metta-sys-elevation-2);
}

.btn-primary:disabled {
  background: var(--metta-sys-color-surface-container);
  color: var(--metta-sys-color-on-surface-variant);
  cursor: not-allowed;
}

.btn-ghost {
  background: transparent;
  color: var(--metta-sys-color-on-surface-variant);
}

.btn-ghost:hover {
  background: var(--metta-sys-color-surface-container);
  color: var(--metta-sys-color-on-surface);
}

.btn-outlined {
  background: transparent;
  border-color: var(--metta-sys-color-outline-variant);
  color: var(--metta-sys-color-on-surface);
}

.btn-outlined:hover {
  border-color: var(--metta-sys-color-on-surface);
}

.btn svg { width: 16px; height: 16px; }

/* ----------------------------------------- *
 * AUDIO MODE                                *
 * ----------------------------------------- */
.audio-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px;
  background: var(--metta-sys-color-surface-container-low);
  border: 1px solid var(--metta-sys-color-outline-variant);
  border-radius: var(--metta-sys-shape-corner-xl);
  margin-bottom: 24px;
}

.mic-btn {
  appearance: none;
  width: 96px;
  height: 96px;
  border-radius: 50%;
  background: var(--metta-sys-color-primary);
  color: var(--metta-sys-color-on-primary);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 200ms;
  box-shadow: var(--metta-sys-elevation-3);
}

.mic-btn:hover { transform: scale(1.05); box-shadow: var(--metta-sys-elevation-4); }
.mic-btn svg { width: 40px; height: 40px; }

.mic-btn.recording {
  background: #DC2626;
  animation: pulse 1.4s infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4), var(--metta-sys-elevation-3); }
  50% { box-shadow: 0 0 0 16px rgba(220, 38, 38, 0), var(--metta-sys-elevation-3); }
}

.mic-state {
  margin-top: 16px;
  font-size: 14px;
  color: var(--metta-sys-color-on-surface-variant);
  text-align: center;
}

.transcript {
  width: 100%;
  margin-top: 24px;
  padding: 16px;
  background: var(--metta-sys-color-surface);
  border-radius: var(--metta-sys-shape-corner-md);
  font-size: 15px;
  line-height: 1.55;
  min-height: 60px;
  color: var(--metta-sys-color-on-surface);
}

.transcript:empty::before {
  content: 'A transcrição vai aparecer aqui enquanto você fala.';
  color: var(--metta-sys-color-on-surface-variant);
  font-style: italic;
}

/* ----------------------------------------- *
 * LOADING                                   *
 * ----------------------------------------- */
.loading-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  padding: 64px 24px;
  text-align: center;
}

.loading-logo {
  width: 96px;
  height: 96px;
  color: var(--metta-sys-color-primary);
  margin-bottom: 32px;
  animation: spin 4s var(--metta-ref-easing-standard) infinite;
}

.loading-logo svg { width: 100%; height: 100%; }

@keyframes spin {
  0% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(180deg) scale(1.05); }
  100% { transform: rotate(360deg) scale(1); }
}

.loading-title {
  font-family: var(--metta-ref-typeface-brand), var(--metta-ref-typeface-fallback-expanded), sans-serif;
  font-weight: 650;
  font-stretch: 132%;
  font-size: 28px;
  margin: 0 0 8px;
}

.loading-sub {
  font-size: 15px;
  color: var(--metta-sys-color-on-surface-variant);
  margin: 0 0 32px;
}

.loading-log {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 360px;
  width: 100%;
}

.loading-step {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--metta-sys-shape-corner-md);
  font-size: 14px;
  color: var(--metta-sys-color-on-surface-variant);
  background: var(--metta-sys-color-surface-container-low);
  opacity: 0.4;
  transition: all 300ms;
  text-align: left;
}

.loading-step.active {
  opacity: 1;
  background: var(--metta-sys-color-primary-container);
  color: var(--metta-sys-color-on-primary-container);
}

.loading-step.done {
  opacity: 1;
  background: var(--metta-sys-color-surface-container);
  color: var(--metta-sys-color-on-surface);
}

.loading-step-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
  opacity: 0.6;
}

.loading-step.active .loading-step-dot {
  animation: dot-pulse 0.8s infinite;
}

@keyframes dot-pulse {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.4); opacity: 1; }
}

/* ----------------------------------------- *
 * RESULT                                    *
 * ----------------------------------------- */
.result-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 32px;
  align-items: start;
}

@media (max-width: 880px) {
  .result-layout { grid-template-columns: 1fr; }
}

.result-preview {
  background: var(--metta-sys-color-surface-container-low);
  border: 1px solid var(--metta-sys-color-outline-variant);
  border-radius: var(--metta-sys-shape-corner-xl);
  padding: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 480px;
}

.result-preview img,
.result-preview svg {
  max-width: 100%;
  max-height: 600px;
  border-radius: var(--metta-sys-shape-corner-md);
  box-shadow: var(--metta-sys-elevation-3);
}

.result-side {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.result-card {
  background: var(--metta-sys-color-surface-container-low);
  border: 1px solid var(--metta-sys-color-outline-variant);
  border-radius: var(--metta-sys-shape-corner-lg);
  padding: 20px;
}

.result-card-title {
  font-size: 11px;
  font-weight: 590;
  font-stretch: 132%;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--metta-sys-color-on-surface-variant);
  margin: 0 0 12px;
}

.qa-row {
  display: flex;
  justify-content: space-between;
  align-items: center;

function icon(name, size) {
  const inner = ICONS[name] || '';
  const vb = name === 'metta' ? '0 0 133 123' : '0 0 24 24';
  const fill = name === 'metta' ? 'currentColor' : 'none';
  const stroke = name === 'metta' ? 'none' : 'currentColor';
  return `<svg width="${size || 18}" height="${size || 18}" viewBox="${vb}" fill="${fill}" stroke="${stroke}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
}

/* ============================================================
   STEPPER
============================================================ */
function renderStepper() {
  let stepsToShow = STATE.mode === 'audio' ? STEPS_AUDIO : (STATE.mode === 'wizard' ? STEPS_WIZARD : ['brand', 'mode', '...']);
  // Filtros condicionais: wiz-imagem só se estilo usa imagem; wiz-search só se escolheu buscar
  const styleObj = (STATE.brand === 'metta' ? STYLES_METTA : STYLES_TIAGO).find(s => s.id === STATE.style);
  const usaImagem = styleObj && styleObj.usaImagem;
  stepsToShow = stepsToShow.filter(s => {
    if (s === 'wiz-imagem') return usaImagem;
    if (s === 'wiz-avatar') return usaImagem && STATE.imageSource === 'generate';
    if (s === 'wiz-imagem-briefing') return usaImagem && STATE.imageSource === 'generate';
    if (s === 'wiz-search') return usaImagem && STATE.imageSource === 'search';
    return true;
  });

  const labels = {
    'brand':         'Marca',
    'mode':          'Modo',
    'wiz-format':    'Formato',
    'wiz-style':     'Estilo',
    'wiz-imagem':    'Imagem',
    'wiz-avatar':    'Avatar',
    'wiz-imagem-briefing': 'Briefing imagem',
    'wiz-search':    'Busca',
    'wiz-copy':      'Copy',
    'wiz-cta':       'CTA',
    'wiz-confirm':   'Revisão',
    'audio-record':  'Briefing',
    'audio-confirm': 'Revisão',
    'loading':       'Gerando',
    'result':        'Pronto'
  };

  const currentIdx = stepsToShow.indexOf(currentStep);
  // Resumimos pra mostrar só steps macro
  const macro = stepsToShow.filter(s => s !== '...');
  return `<div class="stepper">${macro.map((s, i) => {
    const isCurrent = s === currentStep;
    const isDone = !isCurrent && i < currentIdx;
    const cls = isCurrent ? 'active' : (isDone ? 'done' : '');
    const item = isDone
      ? `<button class="stepper-item ${cls}" data-action="jump" data-value="${s}">${labels[s] || s}</button>`
      : `<span class="stepper-item ${cls}">${labels[s] || s}</span>`;
    return item + (i < macro.length - 1 ? '<span class="stepper-arrow">›</span>' : '');
  }).join('')}</div>`;
}

function tplError() {
  const err = STATE.error || 'Erro desconhecido.';
  const isOffline = /Failed to fetch|NetworkError|ERR_CONNECTION/i.test(err);
  const isTimeout = /timeout|aborted/i.test(err);
  const isClarifying = /Preciso de mais detalhes/i.test(err);
  const isShortError = err.trim().length < 30;   // mensagens curtas tipo "Error" sem contexto

  let title, body, extra = '';
  if (isOffline) {
    title = 'Engine offline';
    body = `Não consegui falar com a engine em <code>${ENGINE_URL}</code>. ` +
           (IS_LOCAL_DEV
             ? 'Verifique se o ad-generator está rodando (<code>docker compose up</code>).'
             : 'Problema temporário na função serverless. Tenta de novo em 1 min.');
  } else if (isTimeout) {
    title = 'Geração demorou demais';
    body = 'A geração passou de 60s (limite Vercel Hobby) sem responder. Possíveis causas: image-gen lenta, cold start, ou erro silencioso. Tenta de novo — gerações curtas costumam passar.';
  } else if (isClarifying) {
    title = 'Briefing precisa de mais detalhes';
    body = `A engine pediu mais info: <em>${escapeHtml(err.replace('Preciso de mais detalhes:', '').trim())}</em>. Volta e amplia o briefing ou a copy.`;
  } else if (isShortError) {
    title = 'Erro genérico';
    body = `A engine retornou só "<code>${escapeHtml(err)}</code>" — sem detalhe específico.`;
    extra = `
      <div class="result-card" style="margin-top: 16px;">
        <h4 class="result-card-title">Como diagnosticar</h4>
        <p style="font-size: 13px; line-height: 1.5; margin: 0 0 8px;">
          1. Abre o DevTools (F12) → aba <strong>Network</strong> → marca <strong>Disable cache</strong>
        </p>
        <p style="font-size: 13px; line-height: 1.5; margin: 0 0 8px;">
          2. Clica <em>Tentar de novo</em> abaixo
        </p>
        <p style="font-size: 13px; line-height: 1.5; margin: 0 0 8px;">
          3. Procura a request <code>POST /api/generate</code> que retornou 500/502/504
        </p>
        <p style="font-size: 13px; line-height: 1.5; margin: 0;">
          4. Clica nela → aba <strong>Response</strong> → me cola o JSON inteiro
        </p>
      </div>
    `;
  } else {
    title = 'Erro na geração';
    body = `<code>${escapeHtml(err)}</code>`;
  }

  const runIdInfo = STATE.run_id
    ? `<p style="font-size: 12px; color: var(--metta-sys-color-on-surface-variant); margin: 12px 0 0;">Run ID: <code>${escapeHtml(STATE.run_id)}</code></p>`
    : '';

  return `
    <header class="step-head">
      <p class="step-eyebrow">Algo travou</p>
      <h1 class="step-title">${title}</h1>
      <p class="step-sub">${body}</p>
      ${runIdInfo}
    </header>
    <div class="step-body">${extra}</div>
    <div class="foot">
      <button class="btn btn-ghost" data-action="back">${icon('arrowLeft', 16)} Voltar e editar</button>
      <button class="btn btn-primary" data-action="generate">${icon('refresh', 16)} Tentar de novo</button>

  `;
}

function render() {
  const stage = document.getElementById('stage');
  if (!stage) return;
  stage.innerHTML = (templates[currentStep] || tplBrand)();
  attachStepHandlers();
  // Disparar lógica específica do step
  if (currentStep === 'loading')      runGenerationReal();
  if (currentStep === 'audio-record') initSpeechRecognition();
  if (currentStep === 'result')       hydrateAdPreview();
  // Notifica parent pra ajustar altura do iframe
  notifyHeight();
}

/* Injeta o documento HTML do ad gerado dentro do <iframe id="ad-preview"> +
   escala o iframe pra preservar a proporção EXATA do canvas (1080×{1350|1920|1080}).
   Sem isso, CSS aspect-ratio pode dar resultado visual diferente do canvas real. */
function hydrateAdPreview() {
  if (!STATE.ad_html) return;
  const iframe = document.getElementById('ad-preview');
  if (!iframe) return;

  // Canvas size por formato — bate 1:1 com o que o template HTML usa
  const CANVAS_SIZES = {
    story: [1080, 1920],
    feed:  [1080, 1350],
    sqr:   [1080, 1080],
  };
  const fmt = STATE.ad_format || 'story';
  const [canvasW, canvasH] = CANVAS_SIZES[fmt] || CANVAS_SIZES.story;

  // Container = .result-preview ou parent direto. Pega largura disponível.
  const container = iframe.parentElement;
  const availableW = Math.min(container.clientWidth || 540, 540);
  const scale = availableW / canvasW;

  // Iframe tem tamanho NATURAL = canvas size. Scale via transform.
  iframe.style.width = canvasW + 'px';
  iframe.style.height = canvasH + 'px';
  iframe.style.transform = `scale(${scale})`;
  iframe.style.transformOrigin = 'top left';
  iframe.style.aspectRatio = 'auto';  // sobrescreve regra CSS default

  // Container ocupa o tamanho escalado (não o natural) — evita overflow
  container.style.width = (canvasW * scale) + 'px';
  container.style.height = (canvasH * scale) + 'px';

  iframe.srcdoc = STATE.ad_html;
}

function goto(step) {
  STATE.history.push(currentStep);
  currentStep = step;
  render();
}

function back() {
  if (STATE.history.length === 0) return;
  currentStep = STATE.history.pop();
  render();
}

// Guard contra double-click ou race entre render() e setTimeout(nextFromCurrent)
let _advancing = false;
function autoAdvance() {
  if (_advancing) return;   // já rolou um click no mesmo step — ignora
  _advancing = true;
  render();                  // re-renderiza pra mostrar .selected
  setTimeout(() => {
    nextFromCurrent();
    // _advancing reseta no próximo render do step novo (a flag fica true até trocar de step)
    _advancing = false;
  }, 180);
}

function nextFromCurrent() {
  // wiz-style → wiz-imagem (se usa imagem) ou wiz-copy direto
  if (currentStep === 'wiz-style') {
    const styles = STATE.brand === 'metta' ? STYLES_METTA : STYLES_TIAGO;
    const styleObj = styles.find(s => s.id === STATE.style);
    if (styleObj && styleObj.usaImagem) return goto('wiz-imagem');
    STATE.imageSource = 'none';
    return goto('wiz-copy');
  }
  // wiz-imagem → wiz-search (busca) | wiz-avatar (gerar) | wiz-copy (none)
  if (currentStep === 'wiz-imagem') {
    if (STATE.imageSource === 'search') return goto('wiz-search');
    if (STATE.imageSource === 'generate') return goto('wiz-avatar');
    return goto('wiz-copy');
  }
  const map = {
    'brand':         'mode',
    'mode':          STATE.mode === 'audio' ? 'audio-record' : 'wiz-format',
    'wiz-format':    'wiz-style',
    'wiz-cta':       'wiz-confirm',
    'audio-record':  'audio-confirm'
  };
  const next = map[currentStep];
  if (next) goto(next);
}

/* ============================================================
   HANDLERS
============================================================ */
function attachStepHandlers() {
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', onAction);
  });
  // Inputs livres (copy-input do modo 'gerar' removido — só CTA e audio aqui)
  const ctaInput = document.getElementById('cta-input');
  if (ctaInput) ctaInput.addEventListener('input', () => STATE.cta = ctaInput.value);
  const audioText = document.getElementById('audio-text');
  if (audioText) audioText.addEventListener('input', () => {
    STATE.audioTranscript = audioText.value;
    const t = document.getElementById('transcript');
    if (t) t.textContent = audioText.value;
  });
  // Copy: salva no STATE ao vivo + atualiza contadores de budget por estilo
  [['copy-headline-input','copyHeadline','headline'],
   ['copy-subhead-input','copySubhead','subhead'],
   ['copy-body-input','copyBody','body']].forEach(([id, key, field]) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', () => { STATE[key] = el.value; updateCopyCounters(); });
  });
  updateCopyCounters();
}

/* Atualiza os contadores "X / max" do passo de copy, com cor:
   verde (ok) → âmbar (perto do limite) → vermelho (passou, vai encolher). */
function updateCopyCounters() {
  const map = { headline: 'copy-headline-input', subhead: 'copy-subhead-input', body: 'copy-body-input' };
  Object.keys(map).forEach(field => {
    const span = document.getElementById('cnt-' + field);
    const ta = document.getElementById(map[field]);
    if (!span || !ta) return;
    const max = parseInt(span.dataset.max || '0', 10);
    const len = ta.value.length;
    if (!max) { span.textContent = ''; return; }
    span.textContent = `${len}/${max}`;
    let color = 'var(--ccd-text-muted, #8a8a8a)';
    if (len > max) color = '#e5484d';            // passou — auto-fit vai encolher
    else if (len > max * 0.85) color = '#f5a623'; // chegando no limite
    span.style.color = color;
    span.style.fontWeight = len > max ? '700' : '500';
  });
}

function onAction(e) {
  const el = e.currentTarget;
  const action = el.dataset.action;
  const value = el.dataset.value;
  e.preventDefault();

  switch (action) {
    case 'pick-brand':
      STATE.brand = value;
      autoAdvance();
      break;
    case 'pick-mode':
      STATE.mode = value;
      autoAdvance();
      break;
    case 'pick-format':
      STATE.format = value;
      autoAdvance();
      break;
    case 'pick-style':
      STATE.style = value;
      // Limpa escolhas de imagem ao trocar estilo
      STATE.imageSource = null;
      STATE.searchQuery = '';
      STATE.selectedImageUrl = '';
      autoAdvance();
      break;
    case 'pick-image-source':
      STATE.imageSource = value;
      autoAdvance();
      break;
    case 'run-search': {
      const inp = document.getElementById('search-input');
      STATE.searchQuery = inp ? inp.value.trim() : STATE.searchQuery;
      if (!STATE.searchQuery) {
        alert('Digite um termo de busca antes.');
        return;
      }
      runImageSearch(STATE.searchQuery);
      break;
    }
    case 'pick-search-result':
      STATE.selectedImageUrl = value;
      document.querySelectorAll('.search-result').forEach(b => b.classList.toggle('selected', b.dataset.value === value));
      // Habilita botão "Usar essa imagem"
      const confirmBtn = document.querySelector('[data-action="confirm-search-pick"]');
      if (confirmBtn) confirmBtn.removeAttribute('disabled');
      break;
    case 'confirm-search-pick':
      if (!STATE.selectedImageUrl) return;
      goto('wiz-copy');
      break;
    case 'pick-avatar-segment':
      STATE.avatarSegment = value;
      render();   // re-renderiza pra marcar .selected, sem avançar (variante ainda falta)
      break;
    case 'pick-avatar-variant':
      STATE.avatarVariant = value;
      render();
      break;
    case 'next-from-avatar':
      goto('wiz-imagem-briefing');
      break;
    case 'next':
      nextFromCurrent();
      break;
    case 'back':
      back();
      break;
    case 'jump': {
      // Volta pra step já visitado (via stepper ou via summary)
      const idx = STATE.history.indexOf(value);
      if (idx >= 0) STATE.history = STATE.history.slice(0, idx);
      currentStep = value;
      render();
      break;
    }
    case 'select-preset': {
      // Card de preset de foto clicado — atualiza STATE e re-renderiza (preserva texto digitado)
      const presetId = (el && el.dataset && el.dataset.presetId) || 'fotorrealista';
      // Salva texto digitado antes de re-render
      const ta = document.getElementById('briefing-image-input');
      if (ta) STATE.briefingImage = ta.value;
      STATE.imageStylePreset = presetId;
      render();
      break;
    }
    case 'next-from-imagem-briefing': {
      const ta = document.getElementById('briefing-image-input');
      STATE.briefingImage = ta ? ta.value : '';
      goto('wiz-copy');
      break;
    }
    case 'next-from-copy': {
      // Copy estruturada: 3 campos separados (modo único agora)
      const h = document.getElementById('copy-headline-input');
      const s = document.getElementById('copy-subhead-input');
      const b = document.getElementById('copy-body-input');
      STATE.copyHeadline = h ? h.value : '';
      STATE.copySubhead = s ? s.value : '';
      STATE.copyBody = b ? b.value : '';
      // Compõe copy unificada SÓ pra preview de revisão — backend lê os 3 separados
      STATE.copy = [STATE.copyHeadline, STATE.copySubhead, STATE.copyBody].filter(Boolean).join('\n');
      goto('wiz-cta');
      break;
    }
    case 'pick-cta-suggestion':
      STATE.cta = value;
      render();
      break;
    case 'next-from-cta': {
      const inp = document.getElementById('cta-input');
      STATE.cta = inp ? inp.value : '';
      goto('wiz-confirm');
      break;
    }
    case 'next-from-audio': {
      const ta = document.getElementById('audio-text');
      if (ta) STATE.audioTranscript = ta.value;
      if (!STATE.audioTranscript.trim()) {
        alert('Grava ou escreve o briefing antes de continuar.');
        return;
      }
      goto('audio-confirm');
      break;
    }
    case 'generate':
      goto('loading');
      break;
    case 'toggle-mic':
      toggleMic();
      break;
    case 'regenerate':
      goto('loading');
      break;
    case 'restart':
      Object.keys(STATE).forEach(k => {
        if (k === 'history') STATE[k] = [];
        else if (k === 'imageStylePreset') STATE[k] = 'fotorrealista';  // default seguro
        else if (k === 'avatarSegment') STATE[k] = 'generico';          // default seguro
        else if (k === 'avatarVariant') STATE[k] = 'padrao';            // default seguro
        else STATE[k] = (typeof STATE[k] === 'string') ? '' : null;
      });
      STATE.run_id = null;
      STATE.ad_html = null;
      STATE.ad_format = null;
      STATE.model_id = null;
      STATE.diagnostics = [];
      STATE.warnings = [];
      STATE.qa_report = [];
      STATE.imageSource = null;
      STATE.briefingImage = '';
      STATE.searchQuery = '';
      STATE.selectedImageUrl = '';
      STATE.copyHeadline = '';
      STATE.copySubhead = '';
      STATE.copyBody = '';
      STATE.error = null;
      currentStep = 'brand';
      render();
      break;
    case 'download-png':
      downloadMockPng();
      break;
  }
}

/* ============================================================
   IMAGE SEARCH — busca via Google Custom Search (fase B)
============================================================ */
async function runImageSearch(query) {
  const container = document.getElementById('search-results');
  if (!container) return;
  container.innerHTML = '<div class="search-loading">Buscando imagens…</div>';
  try {
    const url = `${ENGINE_URL}/image-search?q=${encodeURIComponent(query)}`;
    const res = await fetch(url);
    if (!res.ok) {
      const data = await res.json().catch(() => ({ detail: res.statusText }));
      container.innerHTML = `<div class="search-empty">Erro: ${escapeHtml(data.detail || 'falha na busca')}</div>`;
      return;
    }
    const data = await res.json();
    const items = data.results || [];
    if (!items.length) {
      container.innerHTML = '<div class="search-empty">Nada encontrado. Tenta refinar o termo.</div>';
      return;
    }
    container.innerHTML = `<div class="search-grid">${items.map(it => `
      <button class="search-result ${STATE.selectedImageUrl === it.url ? 'selected' : ''}"
              data-action="pick-search-result" data-value="${escapeHtml(it.url)}"
              title="${escapeHtml(it.title || '')}">
        <img src="${escapeHtml(it.thumbnail || it.url)}" alt="${escapeHtml(it.title || '')}" loading="lazy">
      </button>
    `).join('')}</div>`;
    // Reata handlers nos botões novos
    container.querySelectorAll('[data-action]').forEach(el => el.addEventListener('click', onAction));
  } catch (err) {
    container.innerHTML = `<div class="search-empty">Erro de rede: ${escapeHtml(err.message)}</div>`;
  }
}

/* ============================================================
   GENERATION REAL — chama POST /generate da engine
============================================================ */
function serializeBriefing() {
  if (STATE.mode === 'audio') {
    const marca = STATE.brand === 'metta' ? 'Metta (institucional)' : 'Tiago Alves (marca pessoal)';
    return `Marca: ${marca}.\n\nBriefing livre:\n${STATE.audioTranscript}`;
  }
  // Wizard estruturado → texto livre formato esperado pela skill 01
  const marca = STATE.brand === 'metta' ? 'Metta (institucional)' : 'Tiago Alves (marca pessoal)';
  const formatLabel = (FORMATS.find(f => f.id === STATE.format) || {}).label || STATE.format || '—';
  const styleList = STATE.brand === 'metta' ? STYLES_METTA : STYLES_TIAGO;
  const styleInfo = styleList.find(s => s.id === STATE.style) || {};
  const styleDesc = styleInfo.id ? `${styleInfo.id} (${styleInfo.label}) — ${styleInfo.desc}` : '—';

  const copyBlock = `Copy:\n${STATE.copy || '(vazio)'}`;

  return [
    `Marca: ${marca}.`,
    `Formato: ${formatLabel}.`,
    `Estilo visual recomendado: ${styleDesc}.`,
    copyBlock,
    `CTA: ${STATE.cta || '(usar default da marca)'}.`
  ].join('\n\n');
}

async function generateReal(briefing) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), ENGINE_TIMEOUT_MS);
  try {
    const response = await fetch(`${ENGINE_URL}/generate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        briefing,
        mock: false,
        // Quando o wizard mandou estilo explícito, força no backend (pula skill 02)
        ...(STATE.style ? { model_id: STATE.style } : {}),
        // Origem da imagem: gerar com IA (default), buscar URL pronta, ou sem imagem
        ...(STATE.imageSource ? { image_source: STATE.imageSource } : {}),
        ...(STATE.selectedImageUrl ? { image_url: STATE.selectedImageUrl } : {}),
        // Direção visual livre pra skill 04 (opcional)
        ...(STATE.briefingImage && STATE.briefingImage.trim() ? { briefing_image: STATE.briefingImage.trim() } : {}),
        ...(STATE.imageStylePreset ? { image_style_preset: STATE.imageStylePreset } : {}),
        // Avatar-alvo (ICP) — só faz sentido quando a imagem é gerada por IA.
        // Define persona/ambiente/registro emocional da foto no skill 04.
        ...(STATE.imageSource === 'generate' && STATE.avatarSegment ? { avatar_segment: STATE.avatarSegment } : {}),
        ...(STATE.imageSource === 'generate' && STATE.avatarVariant ? { avatar_variant: STATE.avatarVariant } : {}),
        // Formato escolhido pelo wizard (post/carrossel/ad-single/ad-story) — backend
        // resolve pra story/feed/sqr. Sem isso, backend cai no que skill 01 inferiu
        // do texto livre, que pode estar errado.
        ...(STATE.format ? { format: STATE.format } : {}),
        // Copy estruturada — backend lê os 3 campos separados (modo único agora)
        ...(STATE.copyHeadline && STATE.copyHeadline.trim() ? { copy_headline: STATE.copyHeadline.trim() } : {}),
        ...(STATE.copySubhead && STATE.copySubhead.trim() ? { copy_subhead: STATE.copySubhead.trim() } : {}),
        ...(STATE.copyBody && STATE.copyBody.trim() ? { copy_body: STATE.copyBody.trim() } : {}),
        ...(STATE.cta && STATE.cta.trim() ? { cta_text: STATE.cta.trim() } : {})
      }),
      signal: controller.signal
    });
    if (!response.ok) {
      let detail = response.statusText;
      try {
        const data = await response.json();
        detail = data.detail || detail;
      } catch (_) {}
      throw new Error(detail);
    }
    return await response.json();   // { run_id, ok, png_path }
  } finally {
    clearTimeout(timeoutId);
  }
}

function runGenerationReal() {
  const stepEls = document.querySelectorAll('.loading-step');
  if (!stepEls.length) return;

  // Anima steps progressivamente em ~15s/cada (cobre os primeiros 5 com folga).
  // O último ("Validando QA") fica em 'active' até a request resolver.
  let i = 0;
  const advance = () => {
    if (i > 0) {
      stepEls[i - 1].classList.remove('active');
      stepEls[i - 1].classList.add('done');
    }
    if (i < stepEls.length) {
      stepEls[i].classList.add('active');
      i++;
    }
  };
  advance();
  const stepInterval = setInterval(() => {
    if (i < stepEls.length) advance();
    else clearInterval(stepInterval);
  }, 15000);

  // Faz a chamada real
  generateReal(serializeBriefing())
    .then(result => {
      clearInterval(stepInterval);
      stepEls.forEach(el => { el.classList.remove('active'); el.classList.add('done'); });
      STATE.run_id = result.run_id || null;
      STATE.ad_html = result.html || null;
      STATE.ad_format = result.format || null;
      STATE.model_id = result.model_id || null;
      STATE.diagnostics = Array.isArray(result.diagnostics) ? result.diagnostics : [];
      STATE.warnings = Array.isArray(result.warnings) ? result.warnings : [];
      STATE.qa_report = Array.isArray(result.qa_report) ? result.qa_report : [];
      STATE.error = null;
      setTimeout(() => goto('result'), 350);
    })
    .catch(err => {
      clearInterval(stepInterval);
      STATE.error = err.name === 'AbortError' ? 'Request timeout após 5 min' : (err.message || String(err));
      goto('error');
    });
}

/* ============================================================
   WEB SPEECH API (pt-BR)
============================================================ */
let recognition = null;
let recognizing = false;

function initSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    const state = document.getElementById('mic-state');
    if (state) state.textContent = 'Áudio não suportado neste browser. Use o campo de texto abaixo.';
    const btn = document.getElementById('mic-btn');
    if (btn) btn.disabled = true;
    return;
  }
  recognition = new SR();
  recognition.lang = 'pt-BR';
  recognition.interimResults = true;
  recognition.continuous = true;

  let finalText = STATE.audioTranscript || '';

  recognition.onresult = (event) => {
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalText += transcript + ' ';
      else interim += transcript;
    }
    STATE.audioTranscript = (finalText + interim).trim();
    const t = document.getElementById('transcript');
    if (t) t.textContent = STATE.audioTranscript;
    const ta = document.getElementById('audio-text');
    if (ta) ta.value = STATE.audioTranscript;
  };

  recognition.onend = () => {
    recognizing = false;
    const btn = document.getElementById('mic-btn');
    const state = document.getElementById('mic-state');
    if (btn) btn.classList.remove('recording');
    if (btn) btn.innerHTML = `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICONS.mic}</svg>`;
    if (state) state.textContent = STATE.audioTranscript ? 'Pausado. Clique no microfone pra continuar.' : 'Clique no microfone pra começar.';
  };

  recognition.onerror = (e) => {
    console.warn('SpeechRecognition error', e);
    const state = document.getElementById('mic-state');
    if (state) state.textContent = `Erro: ${e.error}. Use o campo de texto abaixo.`;
  };
}

function toggleMic() {
  if (!recognition) return;
  const btn = document.getElementById('mic-btn');
  const state = document.getElementById('mic-state');
  if (recognizing) {
    recognition.stop();
  } else {
    try {
      recognition.start();
      recognizing = true;
      if (btn) btn.classList.add('recording');
      if (btn) btn.innerHTML = `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICONS.stop}</svg>`;
      if (state) state.textContent = 'Ouvindo… fale o que você quer criar.';
    } catch (err) {
      console.warn(err);
    }
  }
}

/* ============================================================
   DOWNLOAD PNG REAL — html2canvas captura o iframe ad-preview
============================================================ */
async function downloadMockPng() {
  const fname = `${STATE.brand}-${STATE.model_id || 'ad'}-${STATE.run_id || Date.now()}.png`;
  const iframe = document.getElementById('ad-preview');
  if (!iframe || !iframe.contentDocument) {
    alert('Preview não disponível pra captura.');
    return;
  }
  if (typeof html2canvas === 'undefined') {
    alert('Lib html2canvas ainda carregando — tenta de novo em 2s.');
    return;
  }
  try {
    const adRoot = iframe.contentDocument.querySelector('.ad-canvas');
    if (!adRoot) throw new Error('Elemento .ad-canvas não encontrado no preview.');

    // Espera fontes carregarem ANTES do snapshot (essencial pra Zalando Sans Expanded
    // não vir com fallback Arial)
    if (iframe.contentDocument.fonts && iframe.contentDocument.fonts.ready) {
      await iframe.contentDocument.fonts.ready;
    }
    // Pequeno delay extra pra layout estabilizar pós-font-load
    await new Promise(r => setTimeout(r, 100));

    // html2canvas — captura em pixel-ratio 1 (canvas é 1080×{1350|1920})
    const canvas = await html2canvas(adRoot, {
      backgroundColor: null,         // mantém transparency se houver
      scale: 1,                      // 1:1 com pixel size do canvas
      useCORS: true,                 // permite background-image data: ou CORS-OK
      logging: false,
      width: adRoot.offsetWidth,
      height: adRoot.offsetHeight,
      windowWidth: adRoot.offsetWidth,
      windowHeight: adRoot.offsetHeight,
    });
    canvas.toBlob((blob) => {
      if (!blob) {
        alert('Falha ao converter canvas → blob.');
        return;
      }
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objUrl;
      a.download = fname;
      a.click();
      URL.revokeObjectURL(objUrl);
    }, 'image/png', 0.95);
  } catch (err) {
    console.error(err);
    alert(`Erro ao baixar: ${err.message}`);
  }
}

/* ============================================================
   HELPERS
============================================================ */
function escapeHtml(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function notifyHeight() {
  // Sincroniza com app.js parent — o iframe usa ResizeObserver mas mandar postMessage como fallback
  try {
    const h = document.documentElement.scrollHeight;
    parent.postMessage({ type: 'iframe-height', height: h }, '*');
  } catch (_) {}
}

   BOOT
============================================================ */
document.addEventListener('DOMContentLoaded', render);

// Sincroniza tema com parent (light/dark)
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'theme-change') {
    document.documentElement.setAttribute('data-theme', e.data.theme);
  }
});

// Tema inicial — herda do parent se possível
try {
  if (parent && parent.document) {
    const parentTheme = parent.document.documentElement.getAttribute('data-theme');
    if (parentTheme) document.documentElement.setAttribute('data-theme', parentTheme);
  }
} catch (_) {}
